<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CView</title>
  <script>
    // 첫 페인트 전에 테마를 정한다(설정 값은 js/theme.js 가 다시 맞춘다).
    try { document.documentElement.dataset.theme = localStorage.getItem('cview.theme') || 'dark'; }
    catch (e) { document.documentElement.dataset.theme = 'dark'; }
    // 보조 창(?w=player|chat|multichat|stats)은 사이드바 없이 한 화면만 그린다.
    try { var w = new URLSearchParams(location.search).get('w'); if (w) document.documentElement.dataset.window = w; } catch (e) { /* 무시 */ }
    // 플랫폼 — Windows 는 시스템 제목 막대(최소화·최대화·닫기)가 웹뷰 위에 있어 신호등 자리 여백이 필요 없다.
    document.documentElement.dataset.platform = /Windows/.test(navigator.userAgent) ? 'windows' : (/Mac/.test(navigator.userAgent) ? 'macos' : 'other');
    // Windows: 화면 단축키는 ⌘(metaKey) 기준으로 짜여 있다 — Ctrl 조합을 ⌘ 조합으로 읽게 한다(모든 처리기보다 먼저, 캡처 단계).
    if (document.documentElement.dataset.platform === 'windows') {
      // 대응: Ctrl → ⌘, Ctrl+Alt → ⌘⌥, Ctrl+Shift+Alt → ⌃⌘(Windows 에는 ⌘·⌃ 가 따로 없다), Ctrl+Tab 은 그대로.
      window.addEventListener('keydown', function (e) {
        if (!e.ctrlKey || e.metaKey || e.key === 'Tab') return;
        var def = function (k, v) { Object.defineProperty(e, k, { value: v }); };
        def('metaKey', true);
        if (e.shiftKey && e.altKey) { def('shiftKey', false); def('altKey', false); }
        else def('ctrlKey', false);
      }, true);
    }
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/multilive.css">
  <link rel="stylesheet" href="css/motion.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-mark">
    <svg class="splash-logo" viewBox="214 190 640 600" aria-hidden="true">
      <defs>
        <linearGradient id="spM" x1=".1" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#00D188"/><stop offset="1" stop-color="#00A3D9"/></linearGradient>
        <linearGradient id="spH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="spS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <clipPath id="spClip"><path d="M330 262 H694 A98 98 0 0 1 792 360 V598 A98 98 0 0 1 694 696 H452 L342 786 A14 14 0 0 1 320 774 L330 696 A98 98 0 0 1 232 598 V360 A98 98 0 0 1 330 262 Z"/></clipPath>
      </defs>
      <g class="sp-bubble">
        <path fill="url(#spM)" d="M330 262 H694 A98 98 0 0 1 792 360 V598 A98 98 0 0 1 694 696 H452 L342 786 A14 14 0 0 1 320 774 L330 696 A98 98 0 0 1 232 598 V360 A98 98 0 0 1 330 262 Z"/>
        <path fill="url(#spH)" d="M330 262 H694 A98 98 0 0 1 792 360 V598 A98 98 0 0 1 694 696 H452 L342 786 A14 14 0 0 1 320 774 L330 696 A98 98 0 0 1 232 598 V360 A98 98 0 0 1 330 262 Z"/>
        <g clip-path="url(#spClip)"><rect class="sp-sheen" x="132" y="190" width="200" height="620" fill="url(#spS)" transform="skewX(-18)"/></g>
      </g>
      <path class="sp-play" fill="#fff" stroke="#fff" stroke-width="34" stroke-linejoin="round" d="M462 392 L462 566 L612 479 Z"/>
      <circle class="sp-ping" cx="776" cy="258" r="44" fill="none" stroke="#FF3B30" stroke-width="14"/>
      <circle class="sp-dot-ring" cx="776" cy="258" r="64"/>
      <circle class="sp-dot" cx="776" cy="258" r="44" fill="#FF3B30"/>
    </svg>
    </div>
    <div class="splash-name">CView</div>
    <div class="splash-bar"><span></span></div>
    <div class="splash-step">준비하는 중…</div>
  </div>
  <div class="app">
    <aside class="sidebar">
      <div class="titlebar-strip" data-tauri-drag-region aria-hidden="true"></div>
      <div class="brand-row" data-tauri-drag-region>
        <div class="brand"><span class="brand-mark"><img class="app-logo logo-light" src="img/logo-light.png" alt="" draggable="false"><img class="app-logo logo-dark" src="img/logo-dark.png" alt="" draggable="false"><span class="brand-sheen" aria-hidden="true"></span></span><span class="brand-name">CView</span></div>
      </div>
      <button class="quick-search" data-tip="검색">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <span class="nav-label">검색</span><kbd></kbd>
      </button>
      <nav id="nav" aria-label="메뉴"></nav>
      <div class="sidebar-live" id="sidebar-live" hidden></div>
      <div class="sidebar-spacer"></div>
      <div class="account" id="account"></div>
    </aside>

    <main class="content">
      <div class="content-drag" data-tauri-drag-region aria-hidden="true"></div>
      <section class="page page-home" data-page="home" hidden>
        <header class="home-header" data-tauri-drag-region>
          <div class="home-hello">
            <h1 class="home-greeting">안녕하세요</h1>
            <p class="home-summary">지금 볼 만한 라이브를 모았어요</p>
          </div>
          <div class="grow" data-tauri-drag-region></div>
          <form class="search-field home-search" role="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input type="search" placeholder="채널, 라이브 검색…" autocomplete="off" spellcheck="false">
          </form>
          <button class="icon-btn round" data-action="refresh" title="새로고침" aria-label="새로고침">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
        </header>
        <div class="page-body"></div>
      </section>

      <section class="page" data-page="following" hidden>
        <header class="page-header" data-tauri-drag-region>
          <h1 class="page-title">팔로잉</h1>
          <span class="page-subtitle">방송 중인 팔로우 채널</span>
          <div class="grow" data-tauri-drag-region></div>
          <button class="icon-btn round" data-action="refresh" title="새로고침" aria-label="새로고침">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
        </header>
        <div class="page-body"></div>
      </section>

      <section class="page" data-page="popular" hidden>
        <header class="page-header" data-tauri-drag-region>
          <h1 class="page-title">인기</h1>
          <span class="page-subtitle">시청자 많은 순</span>
          <div class="grow" data-tauri-drag-region></div>
          <button class="icon-btn round" data-action="refresh" title="새로고침" aria-label="새로고침">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
        </header>
        <div class="page-body"></div>
      </section>

      <section class="page" data-page="search" hidden>
        <header class="page-header" data-tauri-drag-region>
          <h1 class="page-title">검색</h1>
          <form class="search-field" role="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input type="search" placeholder="채널, 라이브 검색…" autocomplete="off" spellcheck="false">
          </form>
        </header>
        <div class="page-body"></div>
      </section>

      <section class="page" data-page="settings" hidden>
        <header class="page-header" data-tauri-drag-region><h1 class="page-title">설정</h1></header>
        <div class="page-body"></div>
      </section>

      <!-- 시청 화면: 플레이어 영역 + 채팅 패널 -->
      <section class="viewer" id="viewer" hidden>
        <div class="viewer-main">
          <header class="page-header viewer-header" data-tauri-drag-region>
            <h1 class="page-title">라이브</h1>
          </header>
          <div class="player-stage">
            <!-- 영상 위 위쪽 오버레이(치지직식): 채널·제목·바로 전환·창 동작 -->
            <div class="stage-top">
              <div class="viewer-avatar"></div>
              <div class="viewer-title">
                <div class="title ellipsis"></div>
                <div class="meta ellipsis"></div>
              </div>
              <button class="icon-btn" id="viewer-close" title="닫기" aria-label="시청 화면 닫기">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <iframe id="player-frame" src="player/player.html" title="플레이어" allow="autoplay; fullscreen"></iframe>
            <div class="player-overlay" role="status" aria-live="polite" hidden><div class="spinner"></div><span></span></div>
          </div>
          <div class="player-controls">
            <button class="icon-btn" id="mute" title="음소거 해제" aria-label="음소거 해제"></button>
            <input type="range" id="volume" min="0" max="100" value="100" aria-label="볼륨">
            <span class="player-status"></span>
            <div class="grow"></div>
            <button class="icon-btn" id="reload" title="다시 연결" aria-label="다시 연결">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
            </button>
            <button class="icon-btn" id="fullscreen" title="전체 화면" aria-label="영상 전체 화면">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
          </div>
        </div>
        <aside class="chat">
          <header class="chat-header">
            <strong>채팅</strong>
            <span class="chat-state">연결 끊김</span>
          </header>
          <div class="chat-notice" hidden></div>
          <div class="chat-list"></div>
          <form class="chat-input">
            <input type="text" maxlength="100" placeholder="채팅을 입력하세요…" autocomplete="off">
            <button class="btn primary" type="submit">채팅</button>
          </form>
        </aside>
      </section>
    </main>
  </div>
</body>
</html>
