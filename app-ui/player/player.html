//    이미 적어 두었다). 즉 **정상 seek 이 5s 를 넘길 수 있다** — 4000 은 하한이 아니었다.

//     = 6000)보다 먼저 풀려야 한다. 6s 이상으로 잡으면 고착 해제 직후 도착하는 첫 트리거가

//     정당화한다: 해제는 **게이트만 연다**(진행 중인 seek 을 취소하지 않는다). seek 대입 즉시

const LATENCY_CORRECTION_MIN_DRIFT_S = 1.5;
const LATENCY_CATCHUP_RATE = 1.03;

const RESYNC_RELOAD_MIN_BUFFER_S = 1.0;
const STALL_TARGET_GRACE_MS = 20000;
const MAX_STALL_TARGET_BACKOFF_S = 3.0;
// hls.js fatal NETWORK/MEDIA 오류는 실제로 startLoad/recoverMediaError로 복구 가능한 경우가
// 많다. Swift에 최종 실패로 보고하기 전에 짧은 윈도우의 제한된 복구 예산을 사용한다.
const FATAL_RECOVERY_WINDOW_MS = 30000;
const FATAL_RECOVERY_MAX_IN_WINDOW = 3;
// [Fix 2026-07-10] 슬라이딩 윈도우 예산만으로는 '느리게 실패하는' 스트림(타임아웃형 —
// 실패 사이클이 10초를 넘으면 30초 윈도우에 2건 이하만 남음)이 예산을 영원히 소진하지
// 않아, 만료/차단된 동일 URL 로 startLoad 를 무한 반복했다. Swift 쪽은 recoverable
// fatal 을 오류로 치지 않으므로(isInErrorState 미설정) 패인은 오류 표시도 자동 재시도도
// 없는 검은 화면으로 영구 방치됐다. 성공 신호(FRAG_LOADED) 없이 연속된 fatal 복구가
// 이 횟수에 도달하면 회복 불가로 승격해 Swift 헬스체크가 새 URL 로 재시작하게 한다.
const FATAL_CONSECUTIVE_MAX = 4;
let _fatalRecoveryHistory = [];
let _consecutiveFatalRecoveries = 0;

function takeFatalRecoverySlot() {
    if (_consecutiveFatalRecoveries >= FATAL_CONSECUTIVE_MAX) return false;
    const now = Date.now();
    _fatalRecoveryHistory = _fatalRecoveryHistory.filter(function(t) {
        return now - t < FATAL_RECOVERY_WINDOW_MS;
    });
    if (_fatalRecoveryHistory.length >= FATAL_RECOVERY_MAX_IN_WINDOW) return false;
    _fatalRecoveryHistory.push(now);
    _consecutiveFatalRecoveries += 1;
    return true;
}

// ─── [매니페스트 창 2026-09-04] `startLoad` 로 되살릴 수 없는 유일한 상태 ───────────
//
// hls.js 1.7.1 실물(`hls.min.js`)에서 확인한 세 가지 사실:
//   · 마스터 매니페스트 요청의 **유일한 발화점**은 `Hls.loadSource()` 의
//     `trigger(MANIFEST_LOADING)` 이다.
//   · `PlaylistLoader.startLoad = function(e){}` — **빈 함수**다. 즉 `hls.startLoad()` 는
//     마스터 매니페스트를 절대 다시 요청하지 않는다.
//   · `PlaylistLoader.stopLoad = destroyInternalLoaders` — 진행 중인 마스터 요청을 **파기**한다.
//
// 따라서 레벨이 한 번도 파싱되지 않은 인스턴스는 `stopLoad()` 한 번으로 영구히 죽는다:
// 재개(`resumeLoading` 의 `startLoad`)도, 치명 오류 복구(`ERROR` 핸들러의 `startLoad`)도
// 전부 no-op 이라 요청이 다시 나가지 않는다. 새 오류도 없으니 `FATAL_CONSECUTIVE_MAX`
// 승격조차 걸리지 않아 Swift 는 이 패인을 '정상'으로 본다 — 오류 카드도 재연결도 없는
// 영구 검은 패인이다.
//
// 이 창은 실재하고 흔하다: `HLSJSPlayerEngine.play(url:)` 이 **같은 MainActor 블록에서**
// `loadSource` 직후 `suspendLoading()` 을 보낸다(가림/디코드 예산 패인). 두 evaluateJS
// 사이 간격은 마이크로초라 매니페스트 응답은 언제나 그 뒤에 온다.
/// 이 인스턴스가 마스터 매니페스트를 파싱해 레벨을 갖고 있는가.
/// (`startLoad` 계열 복구가 의미를 갖는 유일한 전제다.)
function hasParsedLevels() {
    if (!hls) return false;
    const levels = hls.levels;
    return !!(levels && levels.length > 0);
}
/// 마스터 매니페스트를 다시 요청한다. `startLoad` 가 no-op 인 상태의 유일한 탈출구다.
/// 레벨이 없는 세션에서만 부른다 — 레벨이 있으면 `loadSource` 는 MSE 재부착까지 동반해
/// 재생 중인 버퍼를 통째로 버린다.
function reloadManifestSource() {
    if (!hls || !_currentSourceURL) return false;
    try {
        hls.loadSource(_currentSourceURL);
        return true;
    } catch (e) {
        return false;
    }
}

// ─── 프로파일 설정 (v6 / 2026-07-09 — duration 기반 웹 패리티) ─────────────
//
// chzzk 매니페스트 특성 (2026-05-09 검증):
//   • 2초 세그먼트 (EXTINF=2.001) — 짧고 일정.
//   • LL-HLS 태그 없음 (#EXT-X-PART, #EXT-X-SERVER-CONTROL 미발급).
//   • TARGETDURATION=10 (실제는 2s, 이는 hls.js 가 각 세그먼트 fetch 에 사용하는 timeout 의 baseline).
//   • EXT-X-INDEPENDENT-SEGMENTS — 모든 세그먼트가 IDR 시작.
//
// [v6 핵심 — count → duration 전환 (2026-07-09)]
//   hls.js 1.5.x 의 targetLatency = liveSyncDuration ?? (liveSyncDurationCount ×
//   levelDetails.targetduration) + min(1×stallCount, targetduration) — hls.min.js
//   LatencyController 실물 확인. 곱해지는 값은 실측 세그먼트 길이(2s)가 아니라 매니페스트
//   TARGETDURATION(chzzk=10s)이므로, 기존 count=3 의 실효 타깃은 6s 가 아니라 30s 였고
//   liveSyncPosition 도 edge−targetduration(10s) 플로어에 걸렸다 — 앱이 웹보다 항상
//   10~30s 뒤에서 시작·복귀하던 근본 원인. 초 단위 liveSyncDuration/liveMaxLatencyDuration
//   으로 전환해 TARGETDURATION 값에 면역이 되게 한다.
//   [hls.js 포크 2026-10-05] 포크(1.7.3-cview, 패치 0001 liveSyncReference 'segment')에서는 이 플로어가
//     실제 세그먼트(≈2s) 기준이다. 아래 로직은 일반 방어로 그대로 둔다.
//   ⚠ hls.js 는 count 계열과 duration 계열 키 혼용 시 new Hls() 에서 throw ("Illegal
//     hls.js config: don't mix up ...") — count 키는 완전히 제거해야 한다.
//   ⚠ liveSyncOnStallIncrementCount 는 hls.js 1.5.x 에 존재하지 않는 죽은 키였다
//     (스톨 증가는 1s/회 하드코딩, 캡=targetduration) — 함께 제거.
//   또한 liveMaxLatencyDuration > liveSyncDuration 필수(아니면 throw).
//
// 핵심 결정 (v5 에서 유지):
//   • lowLatencyMode — v1 은 LL 끔(false). [matchWeb v2 2026-09-27] 실험 플래그(웹 동기화 v2)에서만 켠다.
//     (2026-09-27 실측: 치지직 LLHLS 재생목록에는 EXT-X-PART·EXT-X-SERVER-CONTROL 이 있다 — 위
//      "LL-HLS 태그 없음" 은 2026-05 관측이다. v1 이 끄는 이유는 partial fetch / blocking reload
//      경로의 요청 증가·보류를 플래그 밖 세션에 들이지 않기 위해서다.)
//   • progressive: false — partial fragment 재생 시도가 chzzk 에서 stall 유발.
//   • stretchShortVideoTrack: false — chzzk 는 정확한 PDT timing, AV stretch 불필요.
//   • testBandwidth: false — 시작 직후 ABR test 로 인한 초기 지연 제거.
//   • maxBufferHole: 0.5 — chzzk 의 작은 IDR 갭에 적합 (1.0 은 너무 큼).
const PROFILES = {
    ultraLow: {
        liveSyncDuration: 4.0,          // 구 count=2 의 설계 의도(2×2s) 복원
        liveMaxLatencyDuration: 12.0,
        liveBackBufferLength: 4,
        maxBufferLength: 6,
        maxMaxBufferLength: 12,
        maxBufferSize: 20 * 1024 * 1024,
    },
    lowLatency: {
        liveSyncDuration: 6.0,          // 구 count=3 의 설계 의도(3×2s) 복원
        liveMaxLatencyDuration: 16.0,
        liveBackBufferLength: 6,
        maxBufferLength: 12,
        maxMaxBufferLength: 20,
        maxBufferSize: 40 * 1024 * 1024,
    },
    // [데드코드 정리 2026-08-11] PROFILES.multiLive 제거 — Swift 쪽에서 이 키를 고르는
    //   경로가 없었다(선대입 2곳을 startStream 이 항상 덮어썼고, 프로파일 결정 함수에
    //   .multiLive 반환 분기가 없다). 8패인 전부 webParity 로 돌고 있었다.
    //   되살릴 때는 Swift PID 목표(webParityHLSJS 3.0s)와 반드시 함께 바꿀 것 —
    //   JS 홀드백 8.0 과 PID 목표 3.0 이 동시에 서면 서로를 되돌린다.

//   • currentTime 진행 polling — hls.js 이벤트 미발화 케이스 감지.
//
// [잔여수정 2026-08-12 STALL-8] **반환값 계약**: 이 트리거가 실제로 복구를 착수했으면
//   (= `_recoveryInFlight` 를 세웠으면) true, 게이트에 걸려 드롭됐으면 false 를 돌려준다.
//   CT 모니터가 자기 시계(`_lastCTChangeAt`)를 언제 소비할지 판단하는 데 쓴다 — 드롭된
//   트리거에도 시계를 리셋하면 재감지가 통째로 6초 밀린다.
//   ⚠ 다른 호출부(ERROR 핸들러 :bufferStalledError 계열, 'waiting' 리스너)는 반환값을
//     쓰지 않는다. 이 계약을 바꾸면 CT 모니터의 재시도 간격이 조용히 6s 로 되돌아간다.
function triggerStallRecovery(reason) {
    if (!hls) return false;
    if (_suspended) return false;    // [A4/A5 M2] 예산 suspend 된 패인은 self-resume 금지 (stage 2+ 가 startLoad 호출)
    if (_recoveryInFlight) return false;
    if (_isSeeking) return false;    // [v4] seek 중에는 절대 트리거 안 함
    if (video.paused) return false;  // 일시정지 중에는 stall 의미 없음

    // [v4] 진짜 stall 인지 다시 검증 — buffer 가 충분히 있고 readyState 가 정상이면
    // 잠깐의 hls.js 이벤트 발화일 수 있으므로 무시. 실제 stall 정의:
    //   readyState <= 2 (HAVE_CURRENT_DATA 이하) AND bufferAhead < 0.5s
    const currentPos = video.currentTime;
    let bufferedAhead = 0;
    try {
        for (let i = 0; i < video.buffered.length; i++) {
            const s = video.buffered.start(i);
            const e = video.buffered.end(i);
            if (currentPos >= s - 0.1 && currentPos <= e + 0.1) {
                bufferedAhead = Math.max(bufferedAhead, e - currentPos);
            }
        }
    } catch (e) {}

    // 진짜 stall 이 아니면 (앞 버퍼 충분 + 정상 readyState) 무시 → 끊김 방지.
    // ct_polling 으로 트리거된 케이스는 보다 보수적: bufferAhead > 1s 면 무시.
    const isCTPoll = reason && reason.indexOf('ct_polling') === 0;
    const isFrameConfirmationTimeout = reason === 'frame_confirmation_timeout';
    if (isFrameConfirmationTimeout) {
        // currentTime/버퍼가 전진해도 합성 프레임이 한 번도 확인되지 않은 특수 정체다.
        // 일반 buffer-health early return을 우회해 영구 spinner 대신 동일 복구 예산을 쓴다.
    } else if (isCTPoll) {
        if (bufferedAhead > 1.0 && video.readyState >= 3) return false;
    } else {
        if (bufferedAhead > 0.5 && video.readyState >= 3) return false;
    }

    const now = Date.now();
    if (now - _lastStallRecoveryTime < STALL_COOLDOWN_MS) return false;

    // [검증 2026-08-13 NEW-2] **콜드 세션 포기** — 이 함수의 다른 모든 갈래보다 앞선다.
    //   여기까지 왔다는 것은 '진짜 스톨' 게이트(버퍼/readyState/쿨다운)를 전부 통과했다는 뜻이고,
    //   `!_hasEverPlayed` 는 이 hls 인스턴스가 프레임을 한 장도 못 뽑았다는 뜻이다. 그 상태가
    //   COLD_SESSION_GIVEUP_MS 를 넘겼으면 스테이지 승격이나 전체 리로드로 나아질 가망이
    //   없다(이미 STAGE-4 리로드를 한 번 이상 밟은 시점이다) — Swift 에 넘겨 **재연결**하게 한다.
    //   `STALL_RECOVERY_EXHAUSTED` 를 쓰는 이유: 이미 있는 에스컬레이션 계약이고, STALL-6 이
    //   도달 불가로 만든 바로 그 신호다. 소비자를 새로 만들면 상위 폴백 정책이 이원화된다.
    //   ⚠ `destroyHls()` 를 함께 불러야 한다 — 안 부르면 CT 모니터가 계속 돌면서 6s 마다
    //     같은 보고를 올린다(포기 신호가 초당 IPC 로 바뀐다).
    //   ⚠ `_stage4History.length` 조항을 빼지 말 것 — "전체 리로드를 **이미 해봤는데도** 안
    //     된다" 가 포기의 근거다. 이 조항이 없으면 로드 직후 예산으로 정지됐다가 한참 뒤
    //     재개된 패인이(그동안 프레임이 없으니 시계는 계속 흐른다) 재개 후 **첫** 스톨에서
    //     재시도 한 번 없이 포기로 떨어진다. `_stage4History` 는 내부 리로드를 넘어 살아남고
    //     외부 loadSource 에서만 비워지므로(STALL-3) 수명이 정확히 이 판단에 맞는다.
    if (!_hasEverPlayed && _coldSessionSince > 0 && _stage4History.length >= 1 &&
        now - _coldSessionSince > COLD_SESSION_GIVEUP_MS) {
        postToSwift('fatalError', {
            type: 'STALL_RECOVERY_EXHAUSTED',
            details: 'no first frame for ' + Math.round((now - _coldSessionSince) / 1000) +
                's — giving up'
        });
        destroyHls();
        _recoveryInFlight = false;
        // 착수해서 세션을 끝냈다 = engaged. (모니터는 destroyHls 가 이미 멈췄다.)
        return true;
    }

    // [Anti-escalation 2026-07] 30s+ 간격의 '격리된' 트리거는 이전 누적 단계를 계승하지 않는다.
    //   stage 는 순수 누적 _stallAttempts 로 정해지고(<=2 stage1 … >7 stage4), 유일한 감소
    //   경로는 'playing' 이벤트 뒤 5s 클린 진행뿐이다. 그런데 false stage-1 은 seek(nudge)라
    //   'playing' 을 안 내보내 카운터가 리셋되지 않는다 → 몇 분 간격의 양성 프리즈가 쌓여
    //   나중의 사소한 hiccup 이 stage2(하드 seek)/stage4(전체 리로드)로 과승격됐다. 30s =
    //   CT/waiting 재트리거 주기(6s)보다 충분히 크고 STAGE4 윈도우(60s)보다 작아, 진짜 연속
    //   장애는 그대로 승격하되 진짜 격리 hiccup 만 감쇠한다.
    if (_lastStallRecoveryTime > 0 && now - _lastStallRecoveryTime > 30000) {
        _stallStage = 0;
        _stallAttempts = 0;
        _stallRecoveryHistory = [];
    }
    markPlaybackInstability();
    _lastStallRecoveryTime = now;
    _stallAttempts++;
    _recoveryInFlight = true;

    _stallRecoveryHistory.push(currentPos);
    if (_stallRecoveryHistory.length > 3) _stallRecoveryHistory.shift();

    // 루프 감지 — 최근 3회 모두 같은 위치 ±0.5s.
    // [잔여수정 2026-08-12 STALL-6] **첫 프레임 이후에만 루프로 인정한다.**
    //   첫 프레임 전에는 `video.currentTime` 이 0 에 고정돼 있어 이 판정이 구조적으로 항상
    //   참이 된다(3번째 트리거에서 무조건 성립). 그래서 콜드스타트 — 8패인 부하로 첫
    //   fragment 가 6s 를 넘기는 상황 — 이 stage 2(`hls.startLoad(-1)`)/stage 3
    //   (`recoverMediaError`) 를 한 번도 밟지 않고 STAGE-4 전체 리로드만 반복했고, 한 사이클
    //   ≈18~22s 라 60s 윈도우 안에 예산 3회를 스스로 태워 `STALL_RECOVERY_EXHAUSTED` 로
    //   끝났다.
    //   ⚠ 이건 '루프 탈출구 제거' 가 아니다 — 첫 프레임 전에도 누적 `_stallAttempts > 7`
    //     갈래로 STAGE-4 에 도달한다(아래 else). 스테이지를 건너뛰지 않을 뿐이다.
    //   ⚠ 조건을 `currentPos > 0` 으로 갈음하지 말 것. 위치가 0 이 아닌 콜드스타트가 실재하고
    //     (부분 버퍼 + 시작 스냅 seek 가 헤드를 옮겨 둔 상태), 반대로 미디어 타임라인이 0 에서
    //     시작하는 스트림에서는 **첫 프레임 이후의 진짜 루프**를 위치가 0 근처라는 이유로
    //     놓친다. 판정 기준은 위치가 아니라 '프레임이 나온 적이 있는가' 다.
    let isLooping = false;
    if (_hasEverPlayed && _stallRecoveryHistory.length >= 3) {
        const first = _stallRecoveryHistory[0];
        const last = _stallRecoveryHistory[_stallRecoveryHistory.length - 1];
        if (Math.abs(last - first) < STALL_LOOP_TOLERANCE_S) isLooping = true;
    }

    if (isLooping) {
        _stallStage = 4;
    } else if (_stallAttempts <= 2) {
        _stallStage = 1;
    } else if (_stallAttempts <= 5) {
        _stallStage = 2;
    } else if (_stallAttempts <= 7) {
        _stallStage = 3;
    } else {
        _stallStage = 4;
    }

    // [UsageOpt CPU 2026-08-06] STALL_RECOVERY 브릿지 IPC + bufAtCur 스캔 제거 —
    //   Swift 는 로그 후 discard 했고, 복구 state machine 은 bufferedAhead 만 사용.

    function endRecovery() {
        _recoveryInFlight = false;
    }

    // [잔여수정 2026-08-12 STALL-4] 이 복구가 속한 세대 + 단일 스테이지 타이머 핸들.
    //   한 시점에 in-flight 복구는 하나뿐(`_recoveryInFlight` 가 보장)이라 핸들도 하나면 된다.
    //   앞선 스테이지 타이머가 아직 살아 있다면 그건 destroyHls 없이 재진입한 경우가 아니므로
    //   정상적으로는 발생하지 않지만, 남아 있으면 끊고 덮어쓴다(핸들 유실 방지).
    const stageGeneration = _recoveryGeneration;
    if (_stallStageTimer) { clearTimeout(_stallStageTimer); _stallStageTimer = null; }
    // 지연 콜백이 "아직 같은 세션인가" 를 묻는 단일 문턱.
    //   · 세대가 바뀌었다 = loadSource(채널 스왑/재연결/STAGE-4 리로드) 또는 stop()/파괴가
    //     끼어들었다 → 그 지점들이 이미 `_recoveryInFlight` 를 내렸으므로 **여기서는 건드리지
    //     않고** 그냥 포기한다(내렸다가는 그 사이 시작된 새 세션의 in-flight 보호를 지운다).
    //   · 정지(`_suspended`)는 세대를 올리지 않는다 → 여기서 endRecovery() 로 정상 반납해야
    //     재개 후 복구가 다시 가능하다(반납을 잊으면 영구 차단 — STALL-2 의 `_resyncInFlight`
    //     굳음과 같은 함정).
    function stageCallbackIsStale() {
        if (stageGeneration !== _recoveryGeneration) return true;
        if (_suspended) { endRecovery(); return true; }
        return false;
    }

    switch (_stallStage) {
        case 1:
            // [v4] 작은 갭 흡수 — 단, 버퍼가 현재 위치에 있으면 nudge 안 함 (불필요한 끊김 방지).
            // 진짜 stall 이면 (앞 버퍼 0 + readyState ≤ 2) play() 만 시도.
            try {
                if (bufferedAhead < 0.1) {
                    // 진짜 데이터 없음 — play() 만 호출 (자동 seek 안 함, hls.js 의 nudge 에 위임).
                    video.play().catch(function() {});
                } else {
                    // 버퍼는 있는데 정체 — 미세 nudge.
                    performPlaybackSeek(currentPos + 0.05, 'stallNudge');
                    video.play().catch(function() {});
                }
            } catch (e) {}
            _stallStageTimer = setTimeout(function() {
                _stallStageTimer = null;
                endRecovery();
            }, 500);
            break;

        case 2:
            // [v3] 안전 seek — buffered range 안에서만 점프, 아니면 startLoad 만.
            try {
                hls.startLoad(-1);
                let target = -1;
                if (hls.liveSyncPosition !== undefined && hls.liveSyncPosition > 0) {
                    target = hls.liveSyncPosition - STALL_RECOVERY_BUFFER_RESERVE_S;
                } else if (video.duration && isFinite(video.duration)) {
                    target = Math.max(0, video.duration - 2);
                }
                // target 위치에 실제 버퍼된 데이터 있는지 확인.
                let safeTarget = -1;
                if (target >= 0) {
                    for (let i = 0; i < video.buffered.length; i++) {
                        const s = video.buffered.start(i);
                        const e = video.buffered.end(i);
                        if (target >= s && target <= e) { safeTarget = target; break; }
                    }
                    // [STAGE2-BACKWARD 2026-09-04] **뒤로 가는 목표는 채택하지 않는다.**
                    //   hls.js 1.7.1 의 `liveSyncPosition` 은 `edge − TARGETDURATION` 을 플로어로
                    //   갖는다. 치지직은 실제 세그먼트가 2s 인데 TARGETDURATION 을 10 으로
                    //   발급하므로, 목표 지연 3~6s 프로파일에서 이 값은 **현재 위치보다 뒤**가
                    //   되기 쉽다. 그 자리로 seek 하면 스톨을 복구하는 대신 이미 본 구간을
                    //   되감아 재생하고 지연을 그만큼 키운다 — 스톨마다 반복되면 누적된다.
                    //   되감기를 버리면 아래 폴백(`latestBufferedRecoveryTarget`)이 이어받는다.
                    //   [hls.js 포크 2026-10-05] 포크에서는 플로어가 세그먼트(≈2s) 기준이라 후진 목표가 드물지만,
                    //     이미 본 구간을 되감지 않는 일반 방어로 유지한다.
                    //   ⚠ 이 가드를 폴백에까지 적용하지 말 것 — 그 경로의 후진은 '전방 런웨이를
                    //     남기려는 의도적 되감기' 이고, 긴 프리즈로 playhead 가 버퍼를 지나친
                    //     경우의 **유일한 탈출구**다.
                    if (safeTarget >= 0 && safeTarget < currentPos) safeTarget = -1;
                    // 데이터 없으면 — seek 하지 않음 (또 stall 만 만들 뿐)
                    if (safeTarget < 0) {
                        // 대신 가장 최근 range에서 충분한 전방 버퍼를 남긴 위치로 되감아
                        // 다음 세그먼트 다운로드 시간을 확보한다.
                        const recoveryTarget = latestBufferedRecoveryTarget();
                        if (recoveryTarget != null) safeTarget = recoveryTarget;
                    }
                }
                if (safeTarget >= 0 && Math.abs(safeTarget - currentPos) > 0.3) {
                    performPlaybackSeek(safeTarget, 'stallBufferedTarget');
                }
                video.play().catch(function() {});
            } catch (e) {}
            _stallStageTimer = setTimeout(function() {
                _stallStageTimer = null;
                endRecovery();
            }, 800);
            break;

        case 3:
            // MSE recover — decode 큐 리셋.
            try {
                hls.recoverMediaError();
                _stallStageTimer = setTimeout(function() {
                    _stallStageTimer = null;
                    // [잔여수정 2026-08-12 STALL-4] 이 500ms 창에 채널 스왑/stop()/정지가 끼면
                    //   아래 seek + play 가 **갓 시작한 다른 세션**의 재생 위치를 건드리거나
                    //   정지시킨 패인을 되살린다. `!hls` 검사만으로는 '인스턴스가 교체됐다' 를
                    //   구분하지 못한다(hls 는 모듈 전역이라 새 인스턴스로 채워져 있다).
                    if (stageCallbackIsStale()) return;
                    if (!hls) { endRecovery(); return; }
                    // 마찬가지로 buffered range 안만 seek.
                    const recoveryTarget = latestBufferedRecoveryTarget();
                    if (recoveryTarget != null) performPlaybackSeek(recoveryTarget, 'stallDecoderRecovery');
                    video.play().catch(function() {});
                    endRecovery();
                }, 500);
            } catch (e) { endRecovery(); }
            break;

        case 4: {
            // [v3] 전체 재로드 — 단, 60s 윈도우 안에 3회 초과 시 fatalError.
            const nowTs = Date.now();
            _stage4History = _stage4History.filter(function(t) {
                return nowTs - t < STAGE4_WINDOW_MS;
            });
            _stage4History.push(nowTs);
            if (_stage4History.length > STAGE4_MAX_IN_WINDOW) {
                postToSwift('fatalError', {
                    type: 'STALL_RECOVERY_EXHAUSTED',
                    details: 'STAGE 4 fired ' + _stage4History.length + ' times in ' +
                        (STAGE4_WINDOW_MS / 1000) + 's — giving up'
                });
                destroyHls();
                _recoveryInFlight = false;
                // 예산 소진도 '실제로 착수한 트리거' 다 — CT 모니터가 시계를 소비해야 한다
                //   (모니터 자체는 destroyHls 가 이미 멈췄다).
                return true;
            }
            postToSwift('error', {
                fatal: false, type: 'STALL_RECOVERY',
                details: 'STAGE_4_FULL_RELOAD ' + _stage4History.length + '/' +
                    STAGE4_MAX_IN_WINDOW + ' in window'
            });
            // [2026-09-25 되감기] 타임시프트 중이면 처음 되감았던 위치가 아니라 **지금 보던 위치**로
            //   다시 싣는다(재로드한 새 인스턴스는 `EXT-X-START` 로 시작 위치를 정한다).
            const url = _timeshiftMode ? timeshiftReloadURL(_currentSourceURL) : _currentSourceURL;
            const profile = _currentSourceProfile;
            // 카운터 리셋 — 새 hls 가 다시 stage 1 부터 진행 가능.
            _stallStage = 0;
            _stallAttempts = 0;
            _stallRecoveryHistory = [];
            if (url && profile) {
                _stallStageTimer = setTimeout(function() {
                    _stallStageTimer = null;
                    // [잔여수정 2026-08-12 STALL-4] **이 100ms 창이 가장 위험하다.**
                    //   여기서 채널 B 로 스왑되면 이 콜백이 `loadSource(A_url, ...)` 를 실행해
                    //   앱은 B 를 재생 중이라고 믿는데 패인은 A 를 재생한다(로그도 오류도 없다).
                    //   stop() 이 끼면 정지된 패인이 스스로 되살아나 디코드/대역폭이 샌다.
                    if (stageCallbackIsStale()) return;
                    try { loadSource(url, profile, true); } catch (e) {}
                    endRecovery();
                }, 100);
            } else {
                endRecovery();
            }
            break;
        }
    }
    return true;
}

// [잔여수정 2026-08-12 STALL-1] **무신호로 일시정지된 패인의 자가 복구.**
//   호출 지점은 CT 모니터의 `video.paused` 분기 하나다 — 그 분기가 이 결함의 사각지대 그

//                              반복 재생**하고, 그때마다 RESUME_PLAY_REJECTED IPC 를 올린다.

            cancelFrameConfirmation(true, frameGeneration);

// [Phase E5 / 2026-05-09] 화질 강제 고정 / ABR 복귀.
//   forceHeight > 0: 해당 height variant 로 currentLevel 고정 (ABR off).
//   targetBitrateKbps > 0: 같은 height 중 목표 bitrate에 가장 가까운 variant 고정.
//   forceHeight <= 0: currentLevel = -1 (ABR on, 자동 적응).
function selectForcedQualityLevel(levels, forceHeight, targetBitrateKbps) {
    if (!levels || !levels.length || !(forceHeight > 0)) return -1;

    // 정확한 높이가 없으면 요청값 이하의 가장 높은 높이, 그것도 없으면 가용 최저 높이.
    // height 메타데이터가 전부 없을 때만 전체 ladder에서 bitrate로 선택한다.
    let selectedHeight = -1;
    let minimumKnownHeight = Number.POSITIVE_INFINITY;
    for (let i = 0; i < levels.length; i++) {
        const height = Number(levels[i].height) || 0;
        if (height <= 0) continue;
        minimumKnownHeight = Math.min(minimumKnownHeight, height);
        if (height <= forceHeight) selectedHeight = Math.max(selectedHeight, height);
    }
    if (selectedHeight < 0 && Number.isFinite(minimumKnownHeight)) {
        selectedHeight = minimumKnownHeight;
    }

    const targetBps = Number.isFinite(targetBitrateKbps) && targetBitrateKbps > 0
        ? targetBitrateKbps * 1000 : 0;
    const isCandidate = function(level) {
        if (selectedHeight < 0) return true;
        return (Number(level.height) || 0) === selectedHeight;
    };
    const isBetterVariant = function(candidate, current) {
        const candidateBitrate = Number(candidate.bitrate) || 0;
        const currentBitrate = Number(current.bitrate) || 0;
        const candidateFPS = Number(candidate.frameRate) || 0;
        const currentFPS = Number(current.frameRate) || 0;
        // Main/PiP source target: prefer the 60fps family before bitrate proximity.
        // 59.94 belongs to this family; a 30fps 8M variant must not beat 60fps 8.1M.
        if (forceHeight === 1080 && targetBitrateKbps === 8000) {
            const candidate60 = candidateFPS >= 59 && candidateFPS <= 61;
            const current60 = currentFPS >= 59 && currentFPS <= 61;
            if (candidate60 !== current60) return candidate60;
        }
        if (targetBps > 0) {
            const candidateDistance = Math.abs(candidateBitrate - targetBps);
            const currentDistance = Math.abs(currentBitrate - targetBps);
            if (candidateDistance !== currentDistance) return candidateDistance < currentDistance;
            if (candidateFPS !== currentFPS) return candidateFPS > currentFPS;
            const candidateAtOrBelow = candidateBitrate <= targetBps;
            const currentAtOrBelow = currentBitrate <= targetBps;
            if (candidateAtOrBelow !== currentAtOrBelow) return candidateAtOrBelow;
            return false; // 완전 동률은 먼저 나온 index 유지 — 매 reload마다 선택 안정.
        }
        if (candidateBitrate !== currentBitrate) return candidateBitrate > currentBitrate;
        return candidateFPS > currentFPS;
    };

    let target = -1;
    for (let i = 0; i < levels.length; i++) {
        if (!isCandidate(levels[i])) continue;
        if (target < 0 || isBetterVariant(levels[i], levels[target])) target = i;
    }
    return target;
}

function applyForcedHeight() {

    const forceHeight = _forcedHeight;

    //   종전에는 고정 목표가 캡을 통째로 무시했다. 멀티라이브는 전 패인이 1080p/8Mbps 로
    //   고정되므로(그 자체가 이 경로다) 회선이 모자란 사용자에게 **자동 강등 경로가 하나도
    //   남지 않았다** — 코디네이터 캡도, 긴급 강등도, 사용자 화질 상한도 전부 무효였다.

    //   여기서 클램프하면 "ABR 을 끈 채 고정" 이라는 성질은 유지되고 **고정 대상만** 낮아진다.
    //   캡이 풀리면(setMaxBitrate(0)) 아래 setter 가 이 함수를 다시 불러 원래 목표로 복귀한다.

            height: applied,

function setForcedHeight(forceHeight, targetBitrateKbps) {

    resetManualLockRestoreBudget();

        Number.isFinite(normalizedBitrate) && normalizedBitrate > 0
        ? normalizedBitrate : 0;

    if (!hls) {

    const levels = (hls.levels || []).map(function(l, i) {
        return {
            index: i, width: l.width, height: l.height, bitrate: l.bitrate,

        levels: levels,

    //   `forceLiveResync` 는 LEVEL_UPDATED 를 1회 기다리되 최대 1.5초 뒤 강제 실행하는
    //   지연 콜백(`apply`)을 남긴다. 그 창 안에 디코드 예산/메뉴 이탈로 여기 들어오면,
    //   콜백의 유일한 유효성 검사인 세대 토큰이 그대로라 통과해 `applyResyncSeek()` 가
    //   **정지시킨 패인에 seek + play** 를 건다. 그 뒤엔 stopLoad 로 새 fragment 가 없고
    //   metrics/CT 모니터·Swift 워치독도 모두 해제된 상태라 감지 주체가 0이다.
    //   destroyHls(:정리 절) 와 같은 두 줄이며, **단일 지점**으로 둔 이유는 `apply` 안에서
    //   조건 분기하면 `_resyncInFlight` 를 내리는 것을 잊는 순간 재개 후 리싱크가 영구
    //   차단되기 때문이다.
    //   ⚠ 되돌릴 때: 이 두 줄을 지우려면 applyResyncSeek 의 `_suspended` 가드(보강)만으로는
    //     부족하다 — `_resyncInFlight` 가 true 로 남아 재개 후 첫 리싱크가 막힌다.
    _resyncGeneration += 1;
    _resyncInFlight = false;
    // [BG Latency 2026-09-04] **쿨다운도 함께 반납한다.**
    //   `HARD_RESYNC_COOLDOWN_MS`(6s)는 '연속 재생 중 하드 리싱크가 몰리는 것' 을 막는
    //   값이다. 그런데 정지는 그 연속성을 끊는다 — 그리고 `resumeLoading` 은 복귀 지연
    //   회수를 **전적으로 `forceLiveResync` 에 위임한다**(위 STALL-2 주석: "재개는
    //   resumeLoading 이 유일한 진입점이며 그 경로가 스스로 forceLiveResync 를 부르므로
    //   리싱크 커버리지 손실도 없다"). 쿨다운을 넘겨주면 6초 안에 재개된 패인 —
    //   멀티라이브 디코드 예산 회전이 정확히 그 주기다 — 의 재개 리싱크가 통째로 드롭돼,
    //   정지 동안 벌어진 지연을 그대로 안고 재생을 시작한다.
    _lastResync = 0;
    // [잔여수정 2026-08-12 STALL-7] **진행 중이던 seek 은 여기서 끝난 것으로 간주한다.**
    //   위 `hls.stopLoad()` 가 진행 중 fragment 요청을 취소하므로, 미버퍼 목표로 점프해 둔
    //   seek 은 이제 완료될 수 없다 → 'seeked' 가 오지 않는다. 정지 중에는 `_suspended` 가
    //   자가복구 3종을 어차피 막지만, 그대로 두면 **재개된 세션이 true 를 물려받아** 스톨
    //   복구·지연 보정·재버퍼 보고가 침묵한 채로 돌아간다.
    //   ⚠ 두 줄은 짝이다 — 타이머만 끊고 플래그를 남기면 워치독까지 사라져 고착이 영구화된다.
    clearSeekGuard();
    _isSeeking = false;
    // [잔여수정 2026-08-12 STALL-1] 의도적 완전정지 = '재생 중이어야 한다' 가 거짓.
    //   (재개는 `resumeLoading` 이 다시 세운다. 여기서 남겨 두면 재개 전 상태를 결함으로 읽는다.)
    _wantsPlaying = false;
    _pausedWhileWantingPlayAt = 0;
    // [SysUsage 4차 2026-07-25] 정지 패인의 텔레메트리 타이머 종료.
    //   기존엔 metrics(2s)/CT 모니터(1s) 가 destroyHls 에서만 멈춰, 정지된 패인이 계속
    //   getVideoPlaybackQuality + hls.levels/details 접근 + fragment 스캔 + 20여 필드
    //   postToSwift IPC 를 수행했다(8패인 정지 시 초당 ~12회 무의미 웨이크업).
    //   마지막 1회는 반드시 보내 paused:true 를 확정 전달한다 — Swift 스냅샷 핸들러가 이
    //   값으로 isPlaying=false 를 세우고 BW 코디네이터 보고에서 정지 패인을 제외한다.
    //   (순서 중요: _suspended=true + video.pause() 이후이므로 maybeCorrectLatency 는
    //    즉시 리턴 — seek 부작용 없음.)
    try { collectMetrics(); } catch (e) {}
    stopMetrics();
    stopCTMonitor();
    // [Rebuffer 신호 2026-07-26] 의도적 정지는 재버퍼가 아니다 — 대기 중 보고를 취소한다.
    discardStallReport();
    // [데드코드 정리 2026-08-11] postToSwift('suspended') 제거 — Swift 핸들러가 break 뿐이었다.
    //   정지/재개 상태의 권위는 Swift 가 이미 갖는다(pendingSuspended/isLoadingSuspended).
    //   ⚠ 위의 `try { collectMetrics(); }` 는 절대 지우지 말 것 — paused:true 를 확정 전달하는
    //     마지막 스냅샷이라 BW 코디네이터가 정지 패인을 제외하는 근거다.
}

// [Phase E3] 활성 복귀 — fragment 다운로드 재개 + live edge seek + play.
function resumeLoading() {
    if (!hls || !_suspended) return;
    _suspended = false;
    const resumeGeneration = ++_resumeGeneration;
    const resumeHls = hls;
    const shouldResumePlayback = _wantsPlayingBeforeSuspend;
    // [잔여수정 2026-08-12 STALL-1] 재개 = '이 패인은 재생 중이어야 한다'. 아래 100ms 콜백이
    //   실제로 forceLiveResync(→ paused 면 play) 또는 video.play() 를 무조건 거는 경로이므로,
    //   이 대입은 기존 동작을 그대로 서술할 뿐 정책을 새로 만들지 않는다(사용자 pause 상태의
    //   패인도 종전부터 재개 시 되살아났다). 여기서부터 거부는 결함으로 관측된다.
    _wantsPlaying = shouldResumePlayback;
    _pausedWhileWantingPlayAt = 0;
    // [SysUsage 4차 2026-07-25] 타이머 선(先)재무장 — startLoad 가 throw 해도 텔레메트리가
    //   죽지 않게 try 블록 앞에 둔다. 둘 다 stop-then-start 라 멱등이며, startCTMonitor 는
    //   _lastCT/_lastCTChangeAt 를 재설정하므로 복귀 첫 틱 stall 오탐이 발생하지 않는다.
    startCTMonitor();
    startMetrics();
    try {
        const deferredAction = _deferredFatalRecoveryAction;
        _deferredFatalRecoveryAction = null;
        const resumePosition = video.currentTime > 0 ? video.currentTime : -1;
        if (deferredAction === 'recoverAndRestart') {
            hls.recoverMediaError();
        }
        // [매니페스트 창 2026-09-04] **레벨이 없는 세션은 `startLoad` 로 못 깨운다.**
        //   정지가 매니페스트 창을 덮쳤거나(구버전 경로·외부 stopLoad) 정지 중 치명
        //   매니페스트 오류가 나면 이 인스턴스에는 레벨이 없다. 그 상태의 `startLoad` 는
        //   완전한 no-op 이라(빈 `PlaylistLoader.startLoad`) 재개해도 검은 화면이 유지되고,
        //   새 오류조차 나지 않아 아무도 알아채지 못한다. 마스터를 다시 요청해야 한다.
        if (!hasParsedLevels() && _currentSourceURL) {
            //   ⚠ `reloadManifestSource()` 대신 **직접** 부른다 — 실패를 아래 catch 로
            //     흘려 `RESUME_FAILED` 단일 보고 경로를 유지하기 위해서다(그 보고가
            //     Swift 의 1회 재발행을 켠다). 헬퍼는 예외를 삼킨다.
            hls.loadSource(_currentSourceURL);
        } else {
            // network / already-reset MSE / generic recovered MSE 모두 ErrorController의 stopLoad 뒤다.
            hls.startLoad(resumePosition);
        }
        if (_resumeTimer) clearTimeout(_resumeTimer);
        _resumeTimer = setTimeout(function() {
            _resumeTimer = null;
            // [잔여수정 2026-08-11 검증 STALL-2/9] **이 콜백도 지연 콜백이다.**
            //   재개 100ms 안에 다시 정지되면(디코드 예산 왕복·빠른 선택 전환) 아래 두 경로가
            //   모두 정지된 패인을 되살린다: `retry()` 는 attemptFirstPlay 의 가드가 막지만
            //   타임머신 분기의 `video.play()` 는 아무도 막지 않고, 4s 안전망도 정지된 패인을
            //   겨냥해 재무장된다. 진입부에서 한 번 더 확인하는 쪽이 단일 문턱이다.
            //   ⚠ 여기서 빠져나가도 손실이 없다 — 다음 `resumeLoading()` 이 같은 콜백을
            //     새로 예약한다(정지 중에는 재개가 반드시 다시 온다).
            if (_suspended || !_wantsPlaying || resumeGeneration !== _resumeGeneration ||
                hls !== resumeHls) return;
            // [잔여수정 2026-08-11 STALL-9] **첫 play 가 아직 확정되지 않았으면 여기서 재시도한다.**
            //   정지 중에는 위 STALL-9 가드가 `attemptFirstPlay` 를 거부하고, 4s 안전망은
            //   1회성이라 그때 소진된다. 이 줄이 없으면 '첫 play 전에 정지됐다가 재개된' 패인
            //   (8채널 콜드스타트의 예산 왕복이 정확히 그렇다)에 play 를 걸 주체가 사라진다.
            //   ⚠ forceLiveResync 보다 **먼저** 부른다 — 성공 시에만 `_pendingMuted/_pendingVolume`
            //     이 복원되므로, 뒤에 두면 리싱크의 play() 가 muted 상태를 굳혀 무음 재생이 된다.
            //   ⚠ 실패해도 안전망을 다시 무장한다(성공 시 attemptFirstPlay 가 스스로 해제).
            let firstPlayRetried = false;
            if (_firstPlayRetry) {
                const retry = _firstPlayRetry;
                try { retry(); } catch (e) {}
                firstPlayRetried = true;
                if (_firstPlayTimer) { clearTimeout(_firstPlayTimer); }
                _firstPlayTimer = setTimeout(retry, 4000);
            }
            // 라이브는 최신 레벨 갱신을 기다리는 gap-crossing 리싱크로 복귀. 타임머신은
            // 현재 DVR 위치에서 재생만 재개해 사용자 seek를 보존한다.
            if (_liveLatencyCorrectionEnabled) {
                // 위에서 로더를 이미 재개했다. 아직 빈 버퍼라는 이유로 100ms 만에
                // 다시 startLoad하면 방금 요청한 fragment를 취소한다. 최신 엣지 seek만 맡긴다.
                forceLiveResync(true);
                // [BG Latency 2026-09-04] **한 번 더, 신선한 지연으로 판정한다.**
                //   `forceLiveResync` 의 값싼 사전 점검은 `hls.latency` 를 읽는데, hls.js 는
                //   그 값을 `timeupdate`/advanced `LEVEL_UPDATED` 에서만 갱신한다. 정지 중에는
                //   둘 다 오지 않으므로 재개 100ms 시점의 값은 **정지 직전의 값**이다 —
                //   정지 동안 라이브 엣지가 아무리 멀어져도 '이미 목표 근처' 로 오판해
                //   gap-crossing 리싱크가 통째로 생략된다(재개마다 지연이 그대로 남는다).
                //   재개 직후 play() 가 걸리면 timeupdate 가 곧 도착하므로, 500ms 뒤 한 번 더
                //   부르면 그때는 신선한 값으로 올바르게 판정한다.
                //   ⚠ 첫 호출이 사전 점검에서 return 했다면 `_lastResync` 는 갱신되지 않으므로
                //     쿨다운에도 걸리지 않는다. 실제로 리싱크가 착수됐다면 `_resyncInFlight`
                //     가드가 두 번째 호출을 조용히 흘린다 — 어느 쪽이든 중복 seek 는 없다.
                //   ⚠ 지연 콜백이므로 위와 **같은 세대·정지 가드**를 반드시 다시 본다.
                setTimeout(function() {
                    if (_suspended || !_wantsPlaying ||
                        resumeGeneration !== _resumeGeneration || hls !== resumeHls) return;
                    if (_liveLatencyCorrectionEnabled) forceLiveResync(true);
                }, 500);
            }
            else if (!firstPlayRetried) {
                const frameGeneration = armFrameConfirmation();
                video.play().catch(function(e) {
                    cancelFrameConfirmation(true, frameGeneration);
                    notePlayRejected('resumeLoading', e);
                });
            }
        }, 100);
    } catch (e) {
        postToSwift('error', { fatal: false, type: 'RESUME_FAILED', details: String(e) });
    }
    // [데드코드 정리 2026-08-11] postToSwift('resumed') 제거 — 위와 동일(소비자 0).
    v2OnResumeLoading();
}

// 자동 라이브 보정 전체 게이트 — 타임머신 진입/복귀 시 Swift가 호출한다.
function setLiveLatencyCorrectionEnabled(enabled) {
    releaseFallbackCatchup('correctionChanged');
    cancelVisibilityResync();
    _liveLatencyCorrectionEnabled = !!enabled;
    const cfg = PROFILES[currentProfile] || PROFILES.lowLatency;
    if (hls) {
        const target = configuredLiveTargetLatency() || cfg.liveSyncDuration;
        hls.config.liveMaxLatencyDuration = _liveLatencyCorrectionEnabled
            ? Math.max(cfg.liveMaxLatencyDuration, target + 4.0)
            : Number.POSITIVE_INFINITY;
    }
    if (_liveLatencyCorrectionEnabled && v2Active()) v2ApplyHlsTarget();
    if (_liveLatencyCorrectionEnabled) {
        _lastResync = 0;
    } else {
        // 진행 중 비동기 resync를 무효화해 LEVEL_UPDATED/timeout이 DVR seek 뒤 발화하지 않게 한다.
        _resyncGeneration += 1;
        _resyncInFlight = false;
    }
    if (_liveLatencyCorrectionEnabled) forceLiveResync();
}

// [Dual-control 2026-07] Swift LowLatencyController 가 이 세션의 지연 보정을 소유하는지 설정.
//   true → JS 배속 보정을 반납하고 Swift PID(rate + 큰 드리프트 seek)에 위임.
//   forceLiveResync/visibilitychange/liveMaxLatencyDuration 은 건드리지 않는다(별도 게이트).
function setLatencyOwnedByController(owned) {
    releaseFallbackCatchup('ownershipChanged');
    _latencyOwnedByController = !!owned;
}

// [Phase E8 / 2026-05-10] Canvas 기반 스크린샷.
//   <video> 의 현재 프레임을 OffscreenCanvas 에 drawImage → toBlob('image/png' or 'image/jpeg').
//   Blob → ArrayBuffer → base64 로 인코딩해 Swift 로 전달.
//   format: 'png' | 'jpeg', quality: 0.0~1.0 (jpeg 만 적용).
function takeScreenshot(format, quality) {
    if (!video || !video.videoWidth || !video.videoHeight) {
        postToSwift('screenshot', { ok: false, error: 'NO_VIDEO_FRAME' });
        return;
    }
    const fmt = (format === 'jpeg') ? 'image/jpeg' : 'image/png';
    const q = (typeof quality === 'number') ? quality : 0.92;
    try {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function(blob) {
            if (!blob) {
                postToSwift('screenshot', { ok: false, error: 'TOBLOB_FAILED' });
                return;
            }
            const reader = new FileReader();
            reader.onload = function() {
                // dataURL → base64 부분만 추출.
                const dataURL = reader.result || '';
                const base64 = dataURL.indexOf(',') >= 0 ? dataURL.substring(dataURL.indexOf(',') + 1) : '';
                postToSwift('screenshot', {
                    ok: true,
                    format: fmt,
                    width: canvas.width,
                    height: canvas.height,
                    base64: base64
                });
            };
            reader.onerror = function() {
                postToSwift('screenshot', { ok: false, error: 'FILEREADER_FAILED' });
            };
            reader.readAsDataURL(blob);
        }, fmt, q);
    } catch (e) {
        postToSwift('screenshot', { ok: false, error: String(e) });
    }
}

// [Phase E7 / 2026-05-10] MediaRecorder 라이브 녹화.
//   video.captureStream() → MediaRecorder. mp4(h264) 우선, 없으면 WebM(vp9/vp8 + opus).
//   주의: chzzk 라이브는 H.264 + AAC 이지만 captureStream → MediaRecorder 가
//   재인코딩하므로 화질 손실 발생. 옵션 mimeType 으로 H.264 mp4 선호 (지원되면).
//
// [엔진 단일화 2026-08-11] **누적 → 스트리밍으로 전환.**
//   종전에는 전체 녹화분을 `_recordChunks` 에 메모리 누적했다가 stop 시점에 하나의
//   Blob → base64(부피 +33%) 로 **한 번에** 넘겼다. 30분 녹화면 수 GB 가 WebContent
//   힙에 쌓이고 마지막에 그 전체가 문자열로 한 번 더 복제된다. VLC 가 담당하던 녹화를
//   hls.js 로 옮기는 이상 그대로 둘 수 없는 구조였다.
//   이제 `start(timeslice)` 로 주기 chunk 를 받아 **도착하는 대로** Swift 에 넘기고,
//   Swift 가 파일에 이어붙인다. 메모리 사용량이 chunk 하나 크기로 유계가 된다.
//
//   ⚠ chunk **순서 보장**이 이 구조의 핵심이다. `blob.arrayBuffer()` 는 비동기라
//     그냥 호출하면 완료 순서가 뒤바뀔 수 있고, 그러면 컨테이너가 깨져 재생 불가
//     파일이 된다. 아래 `_recordQueue` 프라미스 체인으로 직렬화하고 `seq` 를 함께
//     보내 Swift 가 순서를 재확인한다. **이 직렬화를 제거하지 말 것.**
let _recorder = null;
let _recordStartedAt = 0;
let _recordSeq = 0;
let _recordQueue = Promise.resolve();
let _recordBytes = 0;
let _recordMime = '';

const RECORD_MIME_CANDIDATES = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
];

// 지원되는 첫 mimeType. 없으면 빈 문자열.
function pickRecordingMimeType(preferred) {
    const candidates = preferred ? [preferred].concat(RECORD_MIME_CANDIDATES) : RECORD_MIME_CANDIDATES;
    for (const c of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) {
            return c;
        }
    }
    return '';
}

// Swift 가 저장 파일 확장자를 정하려면 **녹화 시작 전에** 컨테이너를 알아야 한다.
// (종전엔 `.ts` 로 이름 짓고 WebM 을 채워 넣을 수 있는 구조였다 — 감사 REC-2 와 같은 결함.)
function reportRecordingCapability() {
    const mime = pickRecordingMimeType(null);
    postToSwift('recording', {
        ok: mime !== '', state: 'capability',
        mimeType: mime,
        error: mime === '' ? 'NO_SUPPORTED_MIME' : null
    });
}

// ArrayBuffer → base64. `String.fromCharCode(...bytes)` 를 한 번에 쓰면 큰 chunk 에서
// 인자 개수 초과로 스택이 터지므로 조각내어 변환한다.
function arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    const step = 0x8000;
    let binary = '';
    for (let i = 0; i < bytes.length; i += step) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    return btoa(binary);
}

function startRecording(mimeType, timesliceMs) {
    if (_recorder) {
        postToSwift('recording', { ok: false, state: 'already', error: 'ALREADY_RECORDING' });
        return;
    }
    if (!video || !video.captureStream) {
        postToSwift('recording', { ok: false, state: 'failed', error: 'CAPTURE_STREAM_UNSUPPORTED' });
        return;
    }
    try {
        const stream = video.captureStream();
        const chosen = pickRecordingMimeType(mimeType);
        if (!chosen) {
            postToSwift('recording', { ok: false, state: 'failed', error: 'NO_SUPPORTED_MIME' });
            return;
        }
        _recordSeq = 0;
        _recordBytes = 0;
        _recordMime = chosen;
        _recordQueue = Promise.resolve();
        _recorder = new MediaRecorder(stream, { mimeType: chosen });

        _recorder.ondataavailable = function(e) {
            if (!e.data || e.data.size === 0) return;
            const blob = e.data;
            const seq = _recordSeq++;
            _recordBytes += blob.size;
            // ⚠ 직렬화 — 위 주석 참조.
            _recordQueue = _recordQueue
                .then(function() { return blob.arrayBuffer(); })
                .then(function(buf) {
                    postToSwift('recording', {
                        ok: true, state: 'chunk',
                        seq: seq,
                        sizeBytes: blob.size,
                        base64: arrayBufferToBase64(buf)
                    });
                })
                .catch(function(err) {
                    postToSwift('recording', {
                        ok: false, state: 'error', seq: seq, error: String(err)
                    });
                });
        };

        _recorder.onstop = function() {
            const durationSec = (Date.now() - _recordStartedAt) / 1000.0;
            const totalBytes = _recordBytes;
            const mime = _recordMime;
            const chunks = _recordSeq;
            // ⚠ 마지막 chunk 전달이 끝난 **뒤에** 종료를 알린다. 먼저 알리면 Swift 가
            //   파일을 닫은 다음 늦은 chunk 가 도착해 잘린 파일이 된다.
            _recordQueue = _recordQueue.then(function() {
                postToSwift('recording', {
                    ok: true, state: 'stopped',
                    mimeType: mime,
                    durationSec: durationSec,
                    sizeBytes: totalBytes,
                    chunks: chunks
                });
                _recorder = null;
            });
        };

        _recorder.onerror = function(ev) {
            postToSwift('recording', {
                ok: false, state: 'error',
                error: (ev && ev.error && ev.error.name) || 'RECORDER_ERROR'
            });
        };

        _recordStartedAt = Date.now();
        // timeslice 를 주면 주기적으로 dataavailable 이 발화한다. 너무 짧으면 브릿지
        // 왕복과 base64 변환이 잦아지고, 너무 길면 메모리 유계 효과가 약해진다.
        const slice = (timesliceMs && timesliceMs > 0) ? timesliceMs : 2000;
        _recorder.start(slice);
        postToSwift('recording', { ok: true, state: 'started', mimeType: chosen });
    } catch (e) {
        _recorder = null;
        postToSwift('recording', { ok: false, state: 'failed', error: String(e) });
    }
}

function stopRecording() {
    if (!_recorder) {
        postToSwift('recording', { ok: false, state: 'idle', error: 'NOT_RECORDING' });
        return;
    }
    try { _recorder.stop(); } catch (e) {
        postToSwift('recording', { ok: false, state: 'failed', error: String(e) });
    }
}

// [UsageOpt A5 2026-08-06] Web Audio 10밴드 EQ 제거 — 앱 EQ 는 VLC 전용,
//   hls.js capabilities 도 equalizer 미포함. 호출부 0 데드 코드였다.
// [엔진 단일화 2026-08-11] **재도입.** VLC 를 제거하면서 이퀄라이저를 hls.js 로 옮겼다.
//   이번에는 호출부(앱 EQ 탭)가 실제로 연결되고 capabilities 에도 `.equalizer` 가 선다.
//
// ⚠ **오디오 경로 회귀 위험이 이 코드의 핵심 주의점이다.**
//   `createMediaElementSource(video)` 를 부르는 순간 `<video>` 의 오디오는 **영구히**
//   Web Audio 그래프를 통해서만 출력된다(되돌릴 수 없다). 그래프가 잘못 연결되거나
//   AudioContext 가 suspended 면 **소리가 그냥 사라진다**. 그래서:
//     1. 그래프는 사용자가 EQ 를 **실제로 켤 때만** 만든다(지연 생성). EQ 를 안 쓰는
//        사용자의 오디오 경로는 손대지 않으므로 회귀 노출이 0 이다.
//     2. EQ 를 끌 때 그래프를 **해체하지 않는다** — 해체가 불가능하다. 대신 모든 밴드
//        gain 을 0(평탄) + preamp 1.0 으로 되돌린다. 소리 경로는 유지된다.
//     3. 생성/변경 때마다 `resume()` 한다. 자동재생 정책으로 context 가 suspended 로
//        시작하는 경우가 있고, 그 상태면 무음이 된다.
//   ⚠ 이 세 가지 중 하나라도 바꾸려면 8채널 멀티라이브에서 오디오 실측이 선행돼야 한다.
const EQ_BAND_FREQUENCIES = [31, 62, 125, 250, 500, 1000, 2000, 4000, 8000, 16000];

let _audioCtx = null;
let _audioSource = null;
let _eqBands = [];
let _preAmpNode = null;
let _eqEnabled = false;

// 그래프를 만든다. 이미 있으면 재사용. 실패 시 false(호출부가 사용자에게 알린다).
function ensureAudioGraph() {
    if (_audioCtx) return true;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx || !video) return false;
    try {
        _audioCtx = new Ctx();
        _audioSource = _audioCtx.createMediaElementSource(video);
        _preAmpNode = _audioCtx.createGain();
        _preAmpNode.gain.value = 1.0;

        let node = _audioSource;
        _eqBands = EQ_BAND_FREQUENCIES.map(function(freq, index) {
            const band = _audioCtx.createBiquadFilter();
            // 양 끝은 shelf, 가운데는 peaking — VLC 10밴드 EQ 와 같은 구성.
            band.type = (index === 0) ? 'lowshelf'
                : (index === EQ_BAND_FREQUENCIES.length - 1) ? 'highshelf' : 'peaking';
            band.frequency.value = freq;
            band.Q.value = 1.0;
            band.gain.value = 0;
            node.connect(band);
            node = band;
            return band;
        });
        node.connect(_preAmpNode);
        _preAmpNode.connect(_audioCtx.destination);
        return true;
    } catch (e) {
        // 그래프를 절반만 만든 상태로 두면 소리가 끊긴다 — 만들다 실패하면 흔적을 지운다.
        _audioCtx = null; _audioSource = null; _eqBands = []; _preAmpNode = null;
        postToSwift('equalizer', { ok: false, error: String(e) });
        return false;
    }
}

function resumeAudioContext() {
    if (_audioCtx && _audioCtx.state === 'suspended' && _audioCtx.resume) {
        _audioCtx.resume().catch(function() { /* 정책상 거부는 다음 사용자 조작에서 재시도 */ });
    }
}

// 밴드 gain 은 dB. VLC EQ 와 같은 단위라 앱 상위 계층의 값을 그대로 쓸 수 있다.
function setEqualizerBand(index, gainDB) {
    if (!_eqEnabled || !_eqBands[index]) return;
    _eqBands[index].gain.value = Math.max(-20, Math.min(20, gainDB));
    resumeAudioContext();
}

function setEqualizerPreAmp(gainDB) {
    if (!_eqEnabled || !_preAmpNode) return;
    const clamped = Math.max(-20, Math.min(20, gainDB));
    _preAmpNode.gain.value = Math.pow(10, clamped / 20);   // dB → 선형 배율
    resumeAudioContext();
}

function setEqualizerEnabled(on, bands, preAmpDB) {
    if (on) {
        if (!ensureAudioGraph()) {
            postToSwift('equalizer', { ok: false, enabled: false, error: 'AUDIO_GRAPH_UNAVAILABLE' });
            return;
        }
        _eqEnabled = true;
        if (bands && bands.length) {
            for (let i = 0; i < _eqBands.length && i < bands.length; i++) {
                _eqBands[i].gain.value = Math.max(-20, Math.min(20, bands[i]));
            }
        }
        if (preAmpDB != null) setEqualizerPreAmp(preAmpDB);
        resumeAudioContext();
        postToSwift('equalizer', { ok: true, enabled: true, bandCount: _eqBands.length });
        return;
    }
    // ⚠ 끌 때 그래프를 해체하지 않는다(위 주석 2번). 평탄화만 한다.
    _eqEnabled = false;
    for (const band of _eqBands) band.gain.value = 0;
    if (_preAmpNode) _preAmpNode.gain.value = 1.0;
    postToSwift('equalizer', { ok: true, enabled: false, bandCount: _eqBands.length });
}

// [데드코드 정리 2026-08-11] `equalizerBandFrequencies()` 제거 — JS 내부 호출도 Swift
//   래퍼도 0건이었고, 그래서 'equalizer' 메시지의 frequencies 필드는 항상 없었다(Swift 는
//   늘 nil 을 파싱했다). 밴드 주파수의 단일 권위는 Swift `EqualizerPreset.frequencies` 다.

// [Phase E6 / 2026-05-10] 비디오 보정 — CSS filter 기반.
//   brightness / contrast / saturate / hue / gamma(근사) / sharpPixel.
//   CSS 표준엔 gamma 가 없어 brightness 보정으로 근사.
let _sharpPixelScaling = false;

function setSharpPixelScaling(on) {
    _sharpPixelScaling = !!on;
    if (!video) return;
    const rendering = _sharpPixelScaling ? 'pixelated' : '';
    if (video.style.imageRendering !== rendering) video.style.imageRendering = rendering;
}

function applyVideoAdjust(opts) {
    if (!video) return;
    if (opts.sharpPixel != null) setSharpPixelScaling(opts.sharpPixel);
    const enabled = !!opts.enabled;
    if (!enabled) {
        _manualAdjust = null;
        _applyComposedFilter();
        return;
    }
    const b = (opts.brightness != null) ? opts.brightness : 1.0;
    const c = (opts.contrast != null) ? opts.contrast : 1.0;
    const s = (opts.saturation != null) ? opts.saturation : 1.0;
    const h = (opts.hue != null) ? opts.hue : 0.0;
    const g = (opts.gamma != null) ? opts.gamma : 1.0;
    const gammaBrightness = (g === 1.0) ? 1.0 : Math.pow(2.0, (g - 1.0) * -1.0);
    // 기본 보정값은 필터 없는 비디오 경로를 유지한다. 활성 보정의 순서/정밀도는 보존.
    const neutral = b === 1 && c === 1 && s === 1 && h === 0 && g === 1;
    _manualAdjust = neutral ? null : { b: b * gammaBrightness, c: c, s: s, h: h };
    _applyComposedFilter();
}

// ─── [화질 향상 2026-10-04] 자동 보정 + 업스케일링 ───
//   · 자동 보정: 2초 메트릭 틱에서 현재 프레임을 32×18 로 떠 밝기 분포·채도를 보고, 어두운 장면은
//     밝기를, 대비가 낮은(뿌연) 장면은 대비를, 색이 바랜 장면은 채도를 **완만하게** 올린다. 결과는
//     수동 보정 위에 곱해 같은 CSS filter 로 나간다 — 새 타이머·프레임별 작업이 없다.
//   · 업스케일링: 표시 크기가 영상 해상도보다 UPSCALE_MIN_RATIO 이상 클 때만 WebGL2 캔버스를
//     <video> 위에 덮어 Catmull-Rom 확대 + CAS(대비 적응형 선명화)로 그린다. 새 프레임이 올 때만
//     (requestVideoFrameCallback) 그리고, 축소·동일 크기(멀티라이브 격자 등)에서는 켜지지 않는다.
//     페이지가 숨으면(visibilitychange) 끄고, 다시 보이면 켠다 — 가려진 창에서는 GPU 를 쓰지 않는다.
//   ⚠ <video> 는 그대로 둔다 — 프레임 확인(rVFC)·스크린샷·녹화·지표가 모두 <video> 를 본다.
let _manualAdjust = null;              // { b, c, s, h } 또는 null(수동 보정 꺼짐)
let _pictureEnhance = { auto: false, upscale: false };
let _autoGain = { b: 1, c: 1, s: 1 };   // 틱마다 목표로 다가가는 자동 보정 배율
let _autoProbe = null;
let _autoUnreadable = false;
let _upscaler = null;
let _upscalerFailed = false;
const AUTO_ENHANCE_SMOOTHING = 0.35;
const UPSCALE_MIN_RATIO = 1.15;
const UPSCALE_MAX_OUTPUT_PIXELS = 3840 * 2160;
const UPSCALE_SHARPNESS = 0.55;

function _clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ─── [선명한 화면 2026-10-22] 치지직 웹 플레이어(pzp-filter-unsharpmask)와 같은 SVG 언샤프 마스크 ───
//   흐린 사본(feGaussianBlur σ=세기, 기본 1)을 빼 경계를 얻고(원본 − 흐림) 원본에 한 번 더한다(k2=1·k3=1).
//   CSS filter 의 url() 로 걸어 웹킷이 그리기 단계에서 처리한다 — 프레임마다 JS·캔버스 작업이 없다.
//   예전 "선명한 화면"(setSharpPixelScaling)은 확대 때 픽셀을 그대로 두는 것이라 이름을 "픽셀 그대로 확대"로 바꿨다.
let _sharpen = 0; // 0 = 끔, 그 밖 = 세기(가우시안 σ)
const SHARPEN_FILTER_ID = 'cview-unsharp';

function _ensureSharpenSvg(sigma) {
    let svg = document.getElementById(SHARPEN_FILTER_ID + '-svg');
    if (!svg) {
        const NS = 'http://www.w3.org/2000/svg';
        svg = document.createElementNS(NS, 'svg');
        svg.id = SHARPEN_FILTER_ID + '-svg';
        svg.setAttribute('width', '0');
        svg.setAttribute('height', '0');
        svg.setAttribute('aria-hidden', 'true');
        svg.style.position = 'absolute';
        svg.innerHTML = '<defs><filter id="' + SHARPEN_FILTER_ID + '" color-interpolation-filters="sRGB">'
            + '<feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>'
            + '<feComposite in="SourceGraphic" in2="blur" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="edge"/>'
            + '<feComposite in="edge" in2="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>'
            + '</filter></defs>';
        document.body.appendChild(svg);
    }
    const blur = svg.querySelector('feGaussianBlur');
    if (blur && blur.getAttribute('stdDeviation') !== String(sigma)) blur.setAttribute('stdDeviation', String(sigma));
}

/** 선명한 화면 켜고 끄기. strength 는 흐림 반경(기본 1 — 치지직과 같다). */
function setSharpen(on, strength) {
    const next = on ? (Number.isFinite(strength) && strength > 0 ? Math.min(3, strength) : 1) : 0;
    if (next) _ensureSharpenSvg(next);
    _sharpen = next;
    _reconcileUpscaler();
    _applyComposedFilter();
    postToSwift('sharpen', { on: !!next, strength: next, gpu: _gpuSharpenActive() });
}

function _composeColorFilter() {
    const a = _pictureEnhance.auto ? _autoGain : { b: 1, c: 1, s: 1 };
    const m = _manualAdjust;
    const b = a.b * (m ? m.b : 1), c = a.c * (m ? m.c : 1), s = a.s * (m ? m.s : 1);
    const h = m ? m.h : 0;
    if (!m && Math.abs(b - 1) < 0.005 && Math.abs(c - 1) < 0.005 && Math.abs(s - 1) < 0.005) return '';
    return [
        'brightness(' + b.toFixed(3) + ')',
        'contrast(' + c.toFixed(3) + ')',
        'saturate(' + s.toFixed(3) + ')',
        'hue-rotate(' + h.toFixed(1) + 'deg)'
    ].join(' ');
}

function _composeVideoFilter() {
    const color = _composeColorFilter();
    // 선명화가 먼저(원본 화소에서 경계를 찾고), 색 보정은 그 위에.
    // [선명한 화면 GPU 2026-10-23] WebGL 캔버스가 선명화를 맡고 있으면 SVG 필터는 걸지 않는다(색 보정만).
    //   SVG 참조 필터(url())는 WebKit 에서 GPU 합성으로 못 넘겨, 영상 프레임마다 화면 크기 래스터를
    //   CPU 로 흐리고 빼서 다시 올렸다 — 1080p·60fps·패인 여러 개면 메인 스레드와 CPU 를 크게 먹었다.
    if (_sharpen && !_gpuSharpenActive()) return 'url(#' + SHARPEN_FILTER_ID + ')' + (color ? ' ' + color : '');
    return color;
}

function _applyComposedFilter() {
    if (!video) return;
    const filter = _composeVideoFilter();
    if (video.style.filter !== filter) video.style.filter = filter;
    if (_upscaler && _upscaler.canvas.style.filter !== filter) _upscaler.canvas.style.filter = filter;
}

// 순수 함수 — RGBA 바이트 배열에서 자동 보정 목표를 만든다(JS 테스트가 직접 부른다).
//   암전·검은 화면(평균 밝기 4% 미만)은 null — 페이드아웃을 밝혀 회색 화면을 만들지 않는다.
function autoEnhanceTarget(data) {
    const count = Math.floor(data.length / 4);
    if (count === 0) return null;
    const bins = new Array(64).fill(0);
    let sumL = 0, sumSat = 0;
    for (let i = 0; i < count; i++) {
        const r = data[i * 4] / 255, g = data[i * 4 + 1] / 255, b = data[i * 4 + 2] / 255;
        const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        sumL += l;
        sumSat += max > 0 ? (max - min) / max : 0;
        bins[Math.min(63, Math.floor(l * 64))]++;
    }
    const mean = sumL / count, sat = sumSat / count;
    if (mean < 0.04) return null;
    function percentile(p) {
        const goal = p * count;
        let seen = 0;
        for (let i = 0; i < 64; i++) { seen += bins[i]; if (seen >= goal) return (i + 0.5) / 64; }
        return 1;
    }
    const range = Math.max(0.05, percentile(0.95) - percentile(0.05));
    const brightness = mean < 0.32 ? _clamp(Math.sqrt(0.42 / mean), 1, 1.22)
        : (mean > 0.72 ? _clamp(Math.sqrt(0.62 / mean), 0.92, 1) : 1);
    // 밝기 분포 폭(p95−p05)이 0.5 미만인 확실히 뿌연 장면만 — 평범한 장면(0.55~0.85)은 건드리지 않는다.
    const contrast = range < 0.5 ? _clamp(Math.sqrt(0.6 / range), 1, 1.25) : 1;
    const saturation = sat < 0.2 ? _clamp(1 + (0.2 - sat) * 1.2, 1, 1.18) : 1;
    return { b: brightness, c: contrast, s: saturation, mean: mean, range: range, sat: sat };
}

    // 비트레이트로 보고하면 멀티라이브 코디네이터가 여유 회선을 소비량으로 오인한다.
    const bandwidthEstimateBps = hls.bandwidthEstimate || 0;
    const activeLevelIndex = hls.currentLevel >= 0 ? hls.currentLevel : hls.loadLevel;
    const activeLevel = (hls.levels || [])[activeLevelIndex];
    const currentLevelBitrateBps = activeLevel
        ? (activeLevel.realBitrate || activeLevel.bitrate || 0) : 0;

    // 레이턴시 (라이브)
    let latency = 0;
    if (hls.latency !== undefined && hls.latency !== null) {
        latency = hls.latency;
    }

    // 실제 currentTime 앞의 연속 버퍼 초. Swift 대역폭 코디네이터도 같은 원시값을 쓴다.
    let bufferLength = 0;
    const playbackRange = bufferedRangeContaining(video.currentTime);
    if (playbackRange) bufferLength = Math.max(0, playbackRange.end - video.currentTime);

    // 버퍼 건강도 (0-1). maxBufferLength는 메모리 상한이지 정상 라이브 전방 버퍼 목표가
    // 아니다. webParity 실측 전방 버퍼 2.7s를 12s 상한으로 나누던 기존 계산은 항상
    // 0.23 부근을 보고해 Swift catch-up을 영구 차단했다. liveSyncDuration을 기준으로
    // 정규화해 실제 고갈 위험을 표현한다.
    // [데드코드 정리 2026-08-11] `Math.min(maxBufferLength, liveSyncDuration)` 의 min() 항
    //   제거 — 모든 프로파일에서 liveSyncDuration < maxBufferLength 라 결과를 바꾼 적이 없다
    //   (webParity 3<12, ultraLow 4<6, mirror 6<30). hls.js 설정상 전방 버퍼 상한이 목표
    //   지연보다 작은 프로파일은 성립하지 않으므로 축약해도 안전하다.
    //   ⚠ 이 값은 런타임 setBufferCaps(hls.config 직접 대입)와는 의도적으로 무관하다
    //     (정규화 기준을 세션 중에 흔들지 않기 위함).
    // [지연 정합 2026-08-11] 분모를 프로파일 상수 → `configuredLiveTargetLatency()` 로 교체.
    //   라이브에서 전방 버퍼는 엣지 너머로 자라지 못하므로 **실효 목표 지연이 곧 전방 버퍼의
    //   상한**이다. Swift 목표가 주입돼 프로파일 값보다 작아지면(standard: 6.0→3.0) 분모만
    //   6.0 으로 남아 건강도가 영구히 ≈0.5 로 읽히고, PID 의 버퍼 댐핑(<0.6 → 가속 절반)이
    //   상시 발동한다 — 종전 maxBufferLength 분모가 0.23 을 보고해 캐치업을 영구 차단했던
    //   결함(위 주석)의 재판이다. 주입이 없으면 함수가 프로파일 값을 돌려주므로 동작 불변.
    const targetBuffer = Math.max(3, configuredLiveTargetLatency() || 4);
    const bufferHealth = Math.min(1.0, Math.max(0.0, bufferLength / targetBuffer));
    const frameQuality = updateDecoderPressure();

    // [UsageOpt CPU 2026-08-06] PDT fragment 역스캔 + PDT/liveSync 메트릭 송신 제거 —
    //   Swift 읽기 경로 0(parity 디버그는 hls.latency 만 사용).
    //   mediaDuration(Time Machine) · seekable 은 유지(O(1) 속성 읽기).
    let mediaDuration = 0;
    const level = activeLevel;
    if (level && level.details && level.details.totalduration) {
        mediaDuration = level.details.totalduration;
    }
    let seekableStart = 0;
    let seekableEnd = 0;
    // [2026-09-25 되감기] 라이브는 hls.js 가 **실제로 받을 수 있는** 재생목록 창을 보낸다.
    //   `liveDurationInfinity` 를 쓰지 않으므로 hls.js 는 `setLiveSeekableRange` 를 부르지 않고,
    //   WebKit 의 `video.seekable` 은 `[0, duration]` 이 된다 — 시작이 늘 0 이라 창이 시청 시간만큼
    //   부풀었다(재생목록은 약 30초인데 수십 분으로 읽힘). 그 범위로 되감으면 hls.js 가
    //   재생목록 밖이라며 라이브로 끌어당긴다. 창의 정본은 재생목록의 첫 조각 시작~엣지다.
    //   로컬 타임시프트 재생목록을 재생할 때도 같은 값이 곧 되감을 수 있는 구간이다.
    const windowDetails = (hls && hls.latestLevelDetails) || (level && level.details) || null;
    if (windowDetails && windowDetails.live && windowDetails.fragments
        && windowDetails.fragments.length > 0
        && isFinite(windowDetails.fragmentStart) && isFinite(windowDetails.edge)
        && windowDetails.edge > windowDetails.fragmentStart) {
        seekableStart = windowDetails.fragmentStart;
        seekableEnd = windowDetails.edge;
    } else if (video.seekable && video.seekable.length > 0) {
        seekableStart = video.seekable.start(0);
        seekableEnd = video.seekable.end(video.seekable.length - 1);
    }

    // [UsageOpt A5 2026-08-06] Swift 가 읽는 필드만 송신(PDT/liveSync 추가 슬림화 2026-08-06).
    postToSwift('metrics', {
        // 진단만을 위한 숫자/불리언. URL/채널명/미디어 내용은 보내지 않는다.
        videoWidth: video.videoWidth || 0,
        videoHeight: video.videoHeight || 0,
        videoFilterApplied: !!video.style.filter && video.style.filter !== 'none',
        sharpPixelScaling: !!_sharpPixelScaling,
        sharpen: _sharpen,
        pictureAutoEnhance: !!_pictureEnhance.auto,
        pictureUpscaleActive: !!(_upscaler && _upscaler.active),
        bandwidthEstimateBps: bandwidthEstimateBps,
        currentLevelBitrateBps: currentLevelBitrateBps,
        latency: latency,
        playbackRate: video.playbackRate,
        bufferHealth: bufferHealth,
        bufferAheadSeconds: bufferLength,
        // [끊김 원인 계측 2026-09-12] 브라우저가 본 프래그먼트 로딩 시간(프록시 홉 포함), 초.
        fragTtfbP50: _quantile(_fragTTFB, 0.5) / 1000,
        fragTtfbP90: _quantile(_fragTTFB, 0.9) / 1000,
        fragTotalP50: _quantile(_fragTotal, 0.5) / 1000,
        fragTotalP90: _quantile(_fragTotal, 0.9) / 1000,
        fragSamples: _fragTTFB.length,
        networkMetrics: networkMetricsFields(),
        // [세그먼트 길이 2026-09-12] 중앙값을 쓴다 — 마지막 프래그먼트 하나는 광고 삽입이나
        //   불연속 경계에서 짧게 튈 수 있다.
        fragDurationSeconds: _quantile(_fragDurations, 0.5),
        // [끊김 원인 계측 2026-09-12 / 2차] 플레이리스트가 새 세그먼트를 내준 지 얼마나 됐나.
        plEndSnAgeMs: _plLastAdvanceAt > 0
            ? (((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now()) - _plLastAdvanceAt)
            : -1,
        plReloadP50Ms: _quantile(_plUpdateIntervals, 0.5),
        plReloadP90Ms: _quantile(_plUpdateIntervals, 0.9),
        plTargetDuration: _plTargetDuration,
        plStaleRatio: _plTotalUpdates > 0 ? (_plStaleUpdates / _plTotalUpdates) : 0,
        droppedFramesDelta: frameQuality.droppedDelta,
        decodedFramesDelta: frameQuality.decodedDelta,
        displayCompositedFramesTotal: frameQuality.displayCompositedTotal,
        droppedFrameRatio: frameQuality.droppedRatio,
        // [프레임 계측 2026-09-22] 누적 카운터 + 연속 0 창 수.
        //   `updateDecoderPressure()` 는 :3438 에서 이미 호출됐으므로 `_zeroDecodeWindows` 는
        //   이 틱의 갱신이 반영된 값이다. 3 이상이 곧 "진짜 정지" 판정선(:1932)이다.
        decodedFramesTotal: frameQuality.decodedTotal,
        droppedFramesTotal: frameQuality.droppedTotal,
        zeroDecodeWindows: _zeroDecodeWindows,
        decoderPressureCap: _decoderPressureCap,
        currentTime: video.currentTime,
        paused: video.paused,
        // [HIDDEN-STALL 2026-09-04] **가림 여부를 Swift 에 알린다.**
        //   JS CT 모니터는 `document.hidden` 을 pause 와 동일 취급해 '가림 중 CT 정지' 를
        //   정상으로 봉인한다(keepAlive 가림에서 오탐 복구가 나던 버그의 수정). 그런데
        //   Swift `checkStall` 에는 가시성 조건이 없고 스냅샷에 그 필드조차 없어, 같은
        //   구간을 **정반대로** 판정했다 — 스냅샷은 신선하고(collectMetrics 는 가림 중에도
        //   계속 돈다) playhead 만 멈춰 있으니 10초 뒤 '진짜 stall' 로 발화한다.
        //   그 뒤가 더 나쁘다: 재연결은 첫 프레임 확정으로만 성공 판정되는데 가림 중에는
        //   합성 프레임이 원리적으로 오지 않아, 예산을 다 태우고 오류 카드로 끝난다.
        hidden: !!(typeof document !== 'undefined' && document.hidden),
        mediaDuration: mediaDuration,
        seekableStart: seekableStart,
        seekableEnd: seekableEnd,
        // [2026-09-25 되감기] 로컬 타임시프트 재생목록을 재생 중이다(창 = 기록된 구간).
        timeshift: _timeshiftMode,
        ...v2MetricsFields(),
    });
}

// ─── 정리 ──────────────────────────────────────────────
function destroyHls() {
    releaseFallbackCatchup('destroy');
    _pendingSeekDiagnostic = null;
    _activeSeekDiagnostic = null;
    _lastDiagnosticMediaTime = 0;
    _loaderEpoch += 1;
    stopMetrics();
    stopCTMonitor();  // [v3] polling timer 정지
    // [Rebuffer 신호 2026-07-26] 소스 교체/파괴는 재버퍼 종료가 아니다 — 보고 없이 상태만 버린다.
    //   (Swift 는 stopSync/재시작 경로에서 _isPausedForBuffering 을 스스로 정리한다.)
    discardStallReport();
    if (_stallResetTimer) { clearTimeout(_stallResetTimer); _stallResetTimer = null; }
    if (_waitingTimer) { clearTimeout(_waitingTimer); _waitingTimer = null; }
    cancelFrameConfirmation(true);
    _resumeGeneration += 1;
    cancelVisibilityResync();
    if (_resumeTimer) { clearTimeout(_resumeTimer); _resumeTimer = null; }
    // [JS-3 2026-08-11] 파괴 시 첫 play 안전망도 끊는다 — 안 끊으면 정지·파괴된 패인이
    //   t+4s 에 스스로 video.play() 를 걸어 디코드 예산을 새게 한다.
    //   ⚠ `_bufferCapOverride` 는 여기서 지우지 않는다. destroyHls 는 `loadSource` 본문
    //     안에서도 불리므로(리셋 단계), 여기서 지우면 BUF-1 수정이 무효가 된다.
    //     풀 반납 시의 정리는 Swift `resetForReuse` 가 명시적으로 한다.
    if (_firstPlayTimer) { clearTimeout(_firstPlayTimer); _firstPlayTimer = null; }
    // [잔여수정 2026-08-11 STALL-9] 파괴된 세션의 시도 함수도 함께 버린다 — 남겨 두면
    //   재개 경로가 옛 hls 인스턴스를 겨냥한 첫 play 를 다시 태운다.
    _firstPlayRetry = null;
    _recoveryInFlight = false;
    // [잔여수정 2026-08-12 STALL-4] 스톨 복구의 지연 콜백(STAGE 3 의 500ms seek+play,
    //   STAGE 4 의 100ms 리로드)도 여기서 함께 무효화한다.
    //   ⚠ 세대 증가와 `_recoveryInFlight = false` 는 **짝**이다(위 전역 선언부 주석 참조).
    //     한쪽만 남기지 말 것 — 세대만 올리면 취소된 콜백이 in-flight 를 반납하지 못해 복구가
    //     영구 차단되고, 플래그만 내리면 옛 콜백이 새 세션에 loadSource/seek 를 건다.
    //   ⚠ 핸들(clearTimeout)과 세대 토큰은 **같은 지점에서 함께 발동하는 중복 방어**다.
    //     뮤테이션 실측: 한쪽만 지우면 회귀 테스트가 여전히 초록이고, **둘 다** 지워야 3건이
    //     실패한다.
    //   ⚠ [정정 2026-08-13 NEW-2] 더 정확히 말하면, 현재 배선에서 세대 검사
    //     (`stageGeneration !== _recoveryGeneration`)는 **도달 불가능하다**. 세대를 올리는
    //     지점이 이 함수 하나뿐인데, 바로 위 줄이 유일한 스테이지 타이머 핸들을 먼저 끊기
    //     때문이다. 즉 지금 실제로 동작하는 문턱은 (a) 이 clearTimeout 과 (b) 콜백의
    //     `_suspended` 분기(suspendLoading 은 핸들을 끊지도 세대를 올리지도 않는 **유일한**
    //     경로라 여기만이 도달 가능하다) 둘이다. 그래도 세대 토큰을 남기는 이유는 하나다 —
    //     이 경로에 **핸들을 보관하지 않는** 지연 콜백이 추가되는 순간(그게 바로 STALL-4
    //     결함의 정체였다) 세대 검사만이 문턱이 된다. '살아 있는 두 번째 방어선' 이라고 적으면
    //     거짓이므로 도달 불가라는 사실을 그대로 남긴다.
    if (_stallStageTimer) { clearTimeout(_stallStageTimer); _stallStageTimer = null; }
    _recoveryGeneration += 1;
    _resyncGeneration += 1;
    v2Teardown('destroy');
    _resyncInFlight = false;
    // [잔여수정 2026-08-12 STALL-7] seek 워치독 타이머도 끊는다 — 남기면 파괴/풀 반납된
    //   패인에서 t+5s 에 깨어나 `SEEK_NEVER_COMPLETED` 유령 보고를 올린다(`_firstPlayTimer`
    //   를 여기서 끊는 것과 같은 규약).
    //   ⚠ 여기서는 `_isSeeking` 을 건드리지 않는다 — 플래그 리셋의 소유자는 `loadSource`
    //     (:이 함수 호출 직후) 다. 여기서 함께 내리면 위 clearSeekGuard 를 지워도 아무 관측
    //     차이가 없어져, 유령 보고를 막는 방어가 테스트로 고정되지 않는다.
    clearSeekGuard();
    if (_seekReleaseTimer) { clearTimeout(_seekReleaseTimer); _seekReleaseTimer = null; }
    _seekGeneration += 1;
    _programmaticSeekGeneration = 0;
    _pendingStallAfterSeek = false;
    // [잔여수정 2026-08-12 STALL-1] 인스턴스가 사라졌으면 '재생 중이어야 한다' 도 거짓이다.
    _wantsPlaying = false;
    _wantsPlayingBeforeSuspend = false;
    _deferredFatalRecoveryAction = null;
    _pausedWhileWantingPlayAt = 0;
    // [검증 2026-08-13 NEW-3] 거부 출처도 **세션 수명과 같다.** `_lastPlayRejection` 은
    //   `RESUME_PLAY_REJECTED` 의 details 에 "last reject: <경로> — <사유>" 로 실려 나가는데,
    //   그 문장의 의미는 '지금 이 패인이 멈춘 원인' 이다. 여기서 지우지 않으면 채널 스왑/
    //   STAGE-4 리로드/풀 반납(resetForReuse → destroyHls)을 넘어 살아남아, **다른 채널의**
    //   거부가 새 세션의 첫 보고에 원인으로 붙는다(기록해 둔 `at` 은 details 에 실리지 않아
    //   낡았다는 것을 알아낼 방법도 없다). 진단 문자열이 틀린 곳을 가리키면 없는 것보다 나쁘다.
    //   ⚠ `_wantsPlaying`/`_pausedWhileWantingPlayAt` 와 같은 지점에 두는 것이 계약이다 —
    //     세 값이 모두 '이 세션의 재생 의도' 라는 한 덩어리다.
    _lastPlayRejection = null;
    if (hls) {
        hls.destroy();
        hls = null;
    }
}

// ─── [Rebuffer 신호 2026-07-26] 실제 재버퍼(waiting↔playing)를 Swift 로 보고 ──────────
//   Swift `LowLatencyController` 는 pauseForBuffering/resumeFromBuffering 계약 위에
//   PID 정지 · 적분(I)항 리셋 · 12s 쿨다운 · 60s 내 3회 진동 감지(가속 상한 1.03) 를 이미
//   구현해 두었는데, 그 신호는 VLC/AVPlayer 의 엔진 phase 이벤트로만 들어온다. hls.js 는
//   'playStarted' 외에 어떤 재생 상태도 올려보내지 않아 **그 보호 계층 전체가 죽은 코드**였다:
//   재버퍼 도중에도 PID 가 계속 지연 오차(정지 중이므로 매 초 +1s)를 적분해, 복귀 직후
//   최대 배속(webParity 1.05x)으로 이제 막 다시 채워진 얇은 버퍼를 곧바로 갉아먹었다.
//   → 한 번의 끊김이 다음 끊김을 부르는 진동. 여기서 그 계약을 hls.js 에도 연결한다.
//
//   오탐 방지: seek 유발 waiting(_isSeeking) · 일시정지 · 정지(_suspended) 는 재버퍼가
//   아니므로 제외하고, 짧은 hiccup 을 걸러내기 위해 디바운스 후에도 readyState<3 일 때만 보고.
const STALL_REPORT_DEBOUNCE_MS = 400;
let _stallReported = false;
let _stallReportTimer = null;

function clearStallReportTimer() {
    if (_stallReportTimer) { clearTimeout(_stallReportTimer); _stallReportTimer = null; }
}

function scheduleStallReport() {
    if (_stallReported || _stallReportTimer) return;
    if (_isSeeking) {
        _pendingStallAfterSeek = true;
        return;
    }
    _stallReportTimer = setTimeout(function() {
        _stallReportTimer = null;
        if (_isSeeking) {
            _pendingStallAfterSeek = true;
            return;
        }
        if (!hls || _suspended || video.paused) return;
        if (video.readyState >= 3) return;
        if (v2DeferStallReport()) return;
        _stallReported = true;
        postToSwift('playbackState', { state: 'stalled', readyState: video.readyState });
        v2NoteDisturbance('stall', Date.now());
    }, STALL_REPORT_DEBOUNCE_MS);
}

function reportPlaybackResumed() {
    clearStallReportTimer();
    if (!_stallReported) return;
    _stallReported = false;
    postToSwift('playbackState', { state: 'playing' });
    v2OnPlaybackResumed();
}

// 보고 없이 상태만 버린다 — 정지/파괴처럼 Swift 쪽이 다른 경로로 이미 정리하는 전이용.
// (여기서 'playing' 을 쏘면 정지된 패인이 재생 중인 것처럼 보고된다.)
function discardStallReport() {
    clearStallReportTimer();
    _stallReported = false;
    _pendingStallAfterSeek = false;
}

// ─── [화질 향상 2026-10-04] 업스케일 캔버스 수명 — 지속 <video>·창에 1회만 등록 ──
//   소스 교체(emptied)는 이전 채널의 마지막 프레임을 즉시 지우고, 영상·창 크기 변화는 확대 필요 여부를 다시 본다.
if (video && video.addEventListener) {
    video.addEventListener('emptied', _clearUpscaledFrame);
    video.addEventListener('resize', _reconcileUpscaler);
}
if (typeof window !== 'undefined' && window.addEventListener) {
    window.addEventListener('resize', _reconcileUpscaler, { passive: true });
}
if (typeof document !== 'undefined' && document.addEventListener) {
    document.addEventListener('visibilitychange', _reconcileUpscaler);
}

// ─── [Stall Recovery v4] 네이티브 stall 감지 리스너 — 지속 <video> 에 1회만 등록 ──
//   loadSource 는 STAGE-4 reload / 채널 스왑마다 재호출되므로 여기서 등록해 리스너 누적 방지.
//   핸들러 본문은 모듈 글로벌(hls/_waitingTimer/_stall*/_isSeeking/_lastCT…)만 참조하므로
//   등록 시점의 hls(=null)에 무관하게 이벤트 발생 시점의 현재 값을 읽는다.
video.addEventListener('waiting', function() {
    releaseFallbackCatchup('mediaWaiting');
    // [Rebuffer 신호 2026-07-26] Swift PID 에 '지금 굶었다' 를 알린다 (디바운스 후 재검증).
    scheduleStallReport();
    if (_waitingTimer) clearTimeout(_waitingTimer);
    _waitingTimer = setTimeout(function() {
        _waitingTimer = null;
        if (!hls || video.paused) return;
        if (video.readyState <= 2) {
            triggerStallRecovery('waiting:readyState=' + video.readyState);
        }
    }, WAITING_TIMEOUT_MS);
});
// [잔여수정 2026-08-12 STALL-7] 'seeked' 가 오지 않는 seek 의 유일한 탈출구.
//   (전역 `_seekGuardTimer` 선언부에 결함 설명, `SEEK_GUARD_TIMEOUT_MS` 선언부에 값의 근거.)
function armSeekGuard(generation) {
    if (_seekGuardTimer) clearTimeout(_seekGuardTimer);
    const guardedGeneration = generation == null ? _seekGeneration : generation;
    _seekGuardTimer = setTimeout(function() {
        _seekGuardTimer = null;
        if (guardedGeneration !== _seekGeneration) return;
        // 이미 정상적으로 풀렸으면(정상 'seeked' 또는 seekByDriftMs 의 400ms 해제) 무소식.
        if (!_isSeeking) return;
        finishSeek(guardedGeneration);
        // 무신호로 삼키지 않는다 — 이 패인은 방금까지 자가복구 3종이 침묵한 상태였다.
        postPlaybackDiagnostic('error', Object.assign(playbackDiagnosticFields(), nativeSeekDiagnosticFields('timeout'), {
            fatal: false, recoverable: true, type: 'SEEK_NEVER_COMPLETED',
            details: "'seeked' did not arrive within " + SEEK_GUARD_TIMEOUT_MS + 'ms',
        }));
    }, SEEK_GUARD_TIMEOUT_MS);
}
function clearSeekGuard() {
    if (_seekGuardTimer) { clearTimeout(_seekGuardTimer); _seekGuardTimer = null; }
}
video.addEventListener('seeking', function() {
    releaseFallbackCatchup('mediaSeeking');
    if (_programmaticSeekGeneration === _seekGeneration && _isSeeking) {
        _programmaticSeekGeneration = 0;
        armSeekGuard(_seekGeneration);
    } else {
        beginSeek();
    }
    v2OnSeeking();
});
video.addEventListener('seeked', function() {
    // 이전 seek의 queued 이벤트가 더 최신 seek를 200ms 뒤 조기 해제하지 못하게 한다.
    if (video.seeking) return;
    scheduleSeekRelease(_seekGeneration, 200);
});
video.addEventListener('playing', function() {
    // play가 큐에 넣은 native event보다 pause/stop이 먼저 실행될 수 있다. native event는
    // 현재 transport 의도를 소유하지 않으며, stale이면 상태/재버퍼 신호를 건드리지 않는다.
    if (_suspended || video.paused || !_wantsPlaying) return;
    // 최신 WebKit은 playing보다 강한 실제 합성 증거인 requestVideoFrameCallback을 쓴다.
    // 미지원 런타임에서만 이 이벤트가 첫 프레임 확인의 폴백이다.
    if (!video.requestVideoFrameCallback) confirmRenderedFrame();
    // [잔여수정 2026-08-12 STALL-1] 실제로 재생 중이라는 네이티브 사실 = 재생 의도도 참이다.
    //   (attemptFirstPlay 성공 콜백과 이중으로 세우는 이유는 위 `_hasEverPlayed` 와 같다 —
    //    Swift `play()`/리싱크 등 다른 경로로 먼저 재생이 성사된 세션도 덮어야 한다.)
    _wantsPlaying = true;
    _pausedWhileWantingPlayAt = 0;
    // [Rebuffer 신호 2026-07-26] 재버퍼 종료 — Swift 가 쿨다운(12s, 상한 1.03x)을 걸고 PID 재개.
    reportPlaybackResumed();
    if (_waitingTimer) { clearTimeout(_waitingTimer); _waitingTimer = null; }
    if (_stallResetTimer) clearTimeout(_stallResetTimer);
    const playingStartedAt = Date.now();
    const startCT = video.currentTime;
    _stallResetTimer = setTimeout(function() {
        const elapsed = (Date.now() - playingStartedAt) / 1000;
        const ctProgressed = video.currentTime - startCT;
        if (elapsed >= 5 && ctProgressed >= 4) {
            _stallStage = 0;
            _stallAttempts = 0;
            _stallRecoveryHistory = [];
            _stage4History = [];
            _fatalRecoveryHistory = [];
            _consecutiveFatalRecoveries = 0;
        }
        _stallResetTimer = null;
    }, STALL_RESET_MS);
});

// ─── Swift에서 호출 가능한 API 알림 ─────────────────────
postToSwift('ready', {
    hlsSupported: typeof Hls !== 'undefined' && Hls.isSupported(),
    pageGen: (typeof window.__cviewPageGen === 'number' ? window.__cviewPageGen : 0)
});
</script>
</body>
