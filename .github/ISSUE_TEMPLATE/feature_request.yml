name: 기능 제안
description: 새 기능이나 개선 아이디어
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 점이 불편한가요?
      description: 지금 어떤 상황에서 무엇이 아쉬운지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 어떻게 동작하면 좋을지 적어 주세요. 참고할 화면이나 다른 앱이 있으면 함께 알려 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법 (선택)
