name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check UI module links and inline scripts
        run: node --experimental-vm-modules scripts/check-ui.mjs
      - name: Test UI lifecycle behavior
        run: node --test app-ui/tests/*.test.mjs
      - name: Check design, contrast and keyboard behavior
        if: runner.os == 'Linux'
        working-directory: ui-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build desktop app
        run: cargo build -p cview-app --locked
