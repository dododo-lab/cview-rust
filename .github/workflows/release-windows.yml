# Windows 설치 파일(NSIS) — 배포 태그(v*)를 밀면 같은 버전으로 만들어 워크플로 산출물로 올린다.
# macOS DMG 는 로컬 scripts/release-macos.sh --dmg 가 만들고(공증), 이 워크플로가 같은 태그의 Windows 판을 만든다.
# 코드 서명 인증서가 없어 설치 파일은 서명되지 않는다(SmartScreen 경고가 뜬다).
name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: clippy (Windows)
        run: cargo clippy -p cview-app --all-targets -- -D warnings

      - name: 테스트 (Windows)
        run: cargo test --workspace

      - name: 설치 파일 빌드(NSIS)
        working-directory: crates/cview-app
        run: cargo tauri build --bundles nsis

      - name: 버전
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content crates/cview-app/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { Get-FileHash $_ -Algorithm SHA256 | Format-List; $_.Length }

      - uses: actions/upload-artifact@v4
        with:
          name: CView_${{ steps.ver.outputs.version }}_windows_x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
