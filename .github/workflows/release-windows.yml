# Windows 설치 파일(NSIS) — GitHub 호스트에서 MSVC로 만드는 예비 경로(수동 실행).
# 정식 배포는 scripts/release-macos.sh --dmg 가 Mac에서 DMG 서명·공증을 하고,
# 전용 Windows 서버에서 x64·ARM64 설치 파일을 같은 버전으로 만든다.
# 이 저장소는 모든 외부 액션을 전체 커밋 SHA 로 고정해야 실행된다(sha_pinning_required).
# 코드 서명 인증서가 없어 설치 파일은 서명되지 않는다(SmartScreen 경고가 뜬다).
name: release-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: windows-release

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: clippy (Windows)
        run: cargo clippy -p cview-app --all-targets -- -D warnings

      - name: 테스트 (Windows)
        run: cargo test --workspace

      - name: 설치 파일 빌드(NSIS)
        working-directory: crates/cview-app
        run: cargo tauri build --bundles nsis

      - name: 버전
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content crates/cview-app/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Get-ChildItem target/release/bundle/nsis/*.exe | ForEach-Object { Get-FileHash $_ -Algorithm SHA256 | Format-List; $_.Length }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CView_${{ steps.ver.outputs.version }}_windows_x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
