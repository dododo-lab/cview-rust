<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- macOS 메뉴 막대 템플릿 아이콘(단색 + 알파) — 18pt 격자. 시스템이 메뉴 막대 외형(밝음·어두움·강조)에 맞춰 색을 입힌다.
       앱 아이콘과 같은 말풍선 + 재생 표시. 재생 표시는 뚫어서(마스크) 메뉴 막대 바탕이 비치게 한다. -->
  <defs>
