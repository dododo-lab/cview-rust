[package]
name = "cview-app"
description = "CView v2 데스크톱 앱 — Tauri 2 셸 (WebView + hls.js)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cview_app"
path = "src/lib.rs"

[[bin]]
name = "cview-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
base64 = "0.22"
uuid = { workspace = true }
cview-core = { path = "../cview-core" }
cview-networking = { path = "../cview-networking" }
cview-auth = { path = "../cview-auth" }
cview-chat = { path = "../cview-chat" }
cview-persistence = { path = "../cview-persistence" }
cview-player = { path = "../cview-player" }
cview-app-core = { path = "../cview-app-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
async-trait.workspace = true
futures-util.workspace = true
percent-encoding = "2"
sha2 = "0.10"
reqwest.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSProcessInfo"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
