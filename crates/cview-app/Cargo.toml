[package]
name = "cview-app"
description = "CView v2 데스크톱 앱 — Tauri 2 셸 (WebView + hls.js)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "cview_app"
path = "src/lib.rs"

[[bin]]
name = "cview-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
base64 = "0.22"
uuid = { workspace = true }
cview-core = { path = "../cview-core" }
cview-networking = { path = "../cview-networking" }
cview-auth = { path = "../cview-auth" }
cview-chat = { path = "../cview-chat" }
cview-persistence = { path = "../cview-persistence" }
cview-player = { path = "../cview-player" }
cview-app-core = { path = "../cview-app-core" }
tauri = { version = "2.12", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
