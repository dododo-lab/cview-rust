[workspace]
resolver = "2"
members = [
    "crates/cview-core",
    "crates/cview-networking",
    "crates/cview-chat",
    "crates/cview-auth",
    "crates/cview-persistence",
    "crates/cview-player",
    "crates/cview-app-core",
    "crates/cview-app",
]

[workspace.package]
edition = "2021"
version = "0.1.54"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
url = "2"
async-trait = "0.1"
rand = "0.8"
regex = "1"
uuid = { version = "1", features = ["serde", "v4"] }
unicode-normalization = "0.1"

# 배포 빌드 — 링크 시간 최적화(LTO)·단일 코드 생성 단위로 크기와 속도를, strip 으로 기호를 덜어 낸다.
# panic 은 unwind 그대로 — 비동기 작업 하나의 패닉이 앱 전체를 끝내지 않게.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
