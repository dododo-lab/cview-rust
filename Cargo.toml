[workspace]
resolver = "2"
members = [
    "crates/cview-core",
    "crates/cview-networking",
    "crates/cview-chat",
    "crates/cview-auth",
    "crates/cview-persistence",
    "crates/cview-player",
    "crates/cview-app-core",
    "crates/cview-app",
]

[workspace.package]
edition = "2021"
version = "0.1.85"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
url = "2"
async-trait = "0.1"
rand = "0.8"
regex = "1"
uuid = { version = "1", features = ["serde", "v4"] }
unicode-normalization = "0.1"

# 배포 빌드 — 링크 시간 최적화(LTO)·단일 코드 생성 단위로 크기와 속도를, strip 으로 기호를 덜어 낸다.
# panic 은 unwind 그대로 — 비동기 작업 하나의 패닉이 앱 전체를 끝내지 않게.
# 빌드 시간은 대부분 이 설정에서 나온다(2026-11-03 측정: 클린 254초, cview-app 만 바꿔도 193초). thin LTO·codegen-units 16 은
# 142초·67초로 빠르지만 실행 파일이 22.8 → 30.5 MB(+33%)로 커져 배포에는 쓰지 않는다.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# 개발·테스트 빌드 — 의존성(tauri·tokio·reqwest 등 400여 개)은 디버그 정보 없이 만든다.
# 우리 크레이트는 디버그 정보를 그대로 두어 디버거·백트레이스의 줄 번호는 유지된다(의존성 프레임은 함수 이름만).
# 측정(2026-11-03): 클린 dev 빌드 112초 → 89초, target/debug 4.4 → 3.8 GiB(테스트 포함 9.4 → 8.6 GiB).
[profile.dev.package."*"]
debug = false
